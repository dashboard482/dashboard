<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>Hub de Bolsa & Mercados</title>
<style>
:root{
  --bg:#0e1117;
  --panel:#131722;
  --panel-2:#1a1e29;
  --border:#2a2e39;
  --ink:#d1d4dc;
  --ink-strong:#f0f3fa;
  --dim:#787b86;
  --up:#26a69a;
  --down:#ef5350;
}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-strong);text-decoration:none;background:var(--panel-2);border:1px solid var(--border);padding:6px 12px;border-radius:6px}
.status-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 6px var(--up)}
.section-title{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.tape-container{margin-bottom:12px;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.widget-box{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:16px}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">← Volver al Hub</a>
  <div class="status-badge">
    <span class="dot-live"></span>
    <span>MERCADOS & CARTERA (EN VIVO)</span>
  </div>
</header>

<!-- CINTAS DE COTIZACIONES SUPERIORES (FLUIDAS PARA MÓVIL) -->
<div class="section-title">Cinta Global: ETFs & Innovación</div>
<div class="tape-container">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        { "proName": "XETRA:VGWL", "title": "Vanguard All-World" },
        { "proName": "NASDAQ:SPCX", "title": "SpaceX" },
        { "proName": "NYSE:MP", "title": "MP Materials" },
        { "proName": "NYSE:IONQ", "title": "IonQ" },
        { "proName": "COMEX:GC1!", "title": "Oro" },
        { "proName": "COMEX:SI1!", "title": "Plata" }
      ],
      "showSymbolLogo": true,
      "colorTheme": "dark",
      "isTransparent": true,
      "displayMode": "adaptive",
      "locale": "es"
    }
    </script>
  </div>
</div>

<!-- MAPA DE CALOR DETALLADO ABAJO -->
<div class="section-title">Mapa de Calor Sectorial (S&P 500)</div>
<div class="widget-box">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
    {
      "exchanges": [],
      "dataSource": "SPX500",
      "grouping": "sector",
      "width": "100%",
      "height": "420",
      "colorTheme": "dark",
      "locale": "es",
      "symbolUrl": "",
      "isTransparent": true
    }
    </script>
  </div>
</div>

</body>
</html>
