<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presión en directo</title>
<style>
  :root {
    --ink: #eef1f0;
    --dim: rgba(238,241,240,0.55);
    --dim2: rgba(238,241,240,0.32);
    --buy: #0d3b2e;
    --buy-hot: #14c97a;
    --sell: #3b0d15;
    --sell-hot: #ff3b5c;
    --neutral: #0a0e0d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--neutral);
    font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    color: var(--ink);
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    height: 100dvh;
    transition: background-color 220ms linear;
    background: var(--neutral);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px 4px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    flex-wrap: wrap;
    flex: 0 0 auto;
  }
  .brand {
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--dim);
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  select, .win-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .win-btn.active {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.35);
  }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 4px 18px 8px;
    text-align: center;
    gap: 2px;
  }

  .symbol {
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--dim);
    flex: 0 0 auto;
  }
  .price {
    font-size: clamp(28px, 7vw, 60px);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .verdict {
    font-size: clamp(16px, 4vw, 26px);
    font-weight: 700;
    letter-spacing: 0.01em;
    margin-top: 0;
    flex: 0 0 auto;
  }
  .delta {
    font-size: clamp(12px, 2.8vw, 16px);
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  .bar-wrap {
    width: min(560px, 86vw);
    height: 8px;
    border-radius: 5px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    display: flex;
    margin-top: 6px;
    flex: 0 0 auto;
  }
  .bar-buy, .bar-sell {
    height: 100%;
  }
  .bar-buy { background: var(--buy-hot); }
  .bar-sell { background: var(--sell-hot); }

  .stats {
    display: flex;
    gap: 22px;
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--dim);
    flex-wrap: wrap;
    justify-content: center;
    flex: 0 0 auto;
  }
  .stats b {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  #chartWrap {
    width: 100%;
    max-width: 900px;
    flex: 1 1 auto;
    min-height: 120px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.28);
    overflow: hidden;
    position: relative;
  }
  .chart-ohlc {
    position: absolute;
    top: 6px;
    left: 10px;
    right: 10px;
    display: flex;
    gap: 12px;
    font-size: 10.5px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.02em;
    pointer-events: none;
    z-index: 2;
  }
  .chart-ohlc b { color: rgba(255,255,255,0.85); font-weight: 600; }
  canvas#chart {
    width: 100%;
    height: 100%;
    display: block;
  }

  footer {
    padding: 4px 18px calc(6px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 10px;
    color: var(--dim2);
    flex: 0 0 auto;
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #666;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-dot.live { background: #14c97a; }
  .status-dot.err { background: #ff3b5c; }

  @media (max-width: 420px) {
    .stats { gap: 16px; }
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><span id="statusDot" class="status-dot"></span><span id="statusText">conectando…</span></div>
    <div class="controls">
      <select id="symbolSelect">
        <option value="btcusdt">BTC/USDT</option>
        <option value="ethusdt">ETH/USDT</option>
        <option value="solusdt">SOL/USDT</option>
        <option value="hypeusdt">HYPE/USDT</option>
        <option value="xrpusdt">XRP/USDT</option>
      </select>
      <button class="win-btn" data-win="15">15s</button>
      <button class="win-btn active" data-win="30">30s</button>
      <button class="win-btn" data-win="60">60s</button>
    </div>
  </header>

  <main>
    <div class="symbol" id="symbolLabel">BTC/USDT · PERP</div>
    <div class="price" id="price">—</div>
    <div class="verdict" id="verdict">esperando datos</div>
    <div class="delta" id="deltaText">Δ 0</div>
    <div class="bar-wrap"><div class="bar-buy" id="barBuy" style="width:50%"></div><div class="bar-sell" id="barSell" style="width:50%"></div></div>
    <div class="stats">
      <div>compra <b id="buyVol">0</b></div>
      <div>venta <b id="sellVol">0</b></div>
      <div>trades <b id="tradeCount">0</b></div>
    </div>
    <div id="chartWrap">
      <div class="chart-ohlc" id="chartOhlc"></div>
      <canvas id="chart"></canvas>
    </div>
  </main>

  <footer>Binance Spot · aggTrade en directo · el color de la pantalla refleja quién domina en la ventana elegida, no una señal de entrada</footer>
</div>

<script>
(function () {
  const stage = document.getElementById('stage');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const priceEl = document.getElementById('price');
  const verdictEl = document.getElementById('verdict');
  const deltaText = document.getElementById('deltaText');
  const barBuy = document.getElementById('barBuy');
  const barSell = document.getElementById('barSell');
  const buyVolEl = document.getElementById('buyVol');
  const sellVolEl = document.getElementById('sellVol');
  const tradeCountEl = document.getElementById('tradeCount');
  const symbolSelect = document.getElementById('symbolSelect');
  const symbolLabel = document.getElementById('symbolLabel');
  const winButtons = document.querySelectorAll('.win-btn[data-win]');
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const chartOhlc = document.getElementById('chartOhlc');

  let wsTrade = null, wsKline = null;
  let windowSec = 30;
  let trades = []; // {t, price, qty, isBuy}
  let lastPrice = null;
  let reconnectTimerTrade = null, reconnectTimerKline = null;
  let backoffTrade = 1500, backoffKline = 1500;
  let tradeOpen = false, klineOpen = false;
  let currentSymbol = null;
  let loadId = 0; // evita que una carga histórica antigua sobrescriba una más nueva

  const TF = '1m'; // timeframe real de Binance para las velas
  const MAX_CANDLES = 90;

  let candles = []; // {t, o,h,l,c}

  function fmtPrice(p) {
    if (p >= 1000) return p.toLocaleString('es-ES', { maximumFractionDigits: 1 });
    if (p >= 1) return p.toLocaleString('es-ES', { maximumFractionDigits: 3 });
    return p.toLocaleString('es-ES', { maximumFractionDigits: 6 });
  }
  function fmtVol(v) {
    if (v >= 1e6) return (v/1e6).toFixed(2) + 'M';
    if (v >= 1e3) return (v/1e3).toFixed(1) + 'k';
    return v.toFixed(2);
  }

  function upsertCandle(t, o, h, l, c) {
    let last = candles[candles.length - 1];
    if (last && last.t === t) {
      last.o = o; last.h = h; last.l = l; last.c = c;
    } else if (!last || t > last.t) {
      candles.push({ t, o, h, l, c });
      if (candles.length > MAX_CANDLES) candles.shift();
    }
  }

  function loadHistory(symbol, myLoadId) {
    const url = 'https://api.binance.com/api/v3/klines?symbol=' + symbol.toUpperCase() + '&interval=' + TF + '&limit=' + MAX_CANDLES;
    fetch(url).then(function (r) { return r.json(); }).then(function (rows) {
      if (myLoadId !== loadId || !Array.isArray(rows)) return;
      candles = rows.map(function (k) {
        return { t: k[0], o: parseFloat(k[1]), h: parseFloat(k[2]), l: parseFloat(k[3]), c: parseFloat(k[4]) };
      });
      drawChart();
      updateOhlcHeader();
    }).catch(function () { /* sin histórico, se irá rellenando en directo */ });
  }

  function updateStatus() {
    if (tradeOpen && klineOpen) {
      statusDot.className = 'status-dot live';
      statusText.textContent = 'en directo';
    } else if (!tradeOpen && !klineOpen) {
      statusDot.className = 'status-dot err';
      statusText.textContent = 'reconectando…';
    } else {
      statusDot.className = 'status-dot';
      statusText.textContent = 'conectando…';
    }
  }

  function connectTrade(symbol) {
    if (reconnectTimerTrade) { clearTimeout(reconnectTimerTrade); reconnectTimerTrade = null; }
    if (wsTrade) { try { wsTrade.onclose = null; wsTrade.close(); } catch(e){} }
    tradeOpen = false;
    updateStatus();
    let socket;
    try {
      socket = new WebSocket('wss://stream.binance.com:9443/ws/' + symbol + '@aggTrade');
    } catch (e) {
      reconnectTimerTrade = setTimeout(function () { connectTrade(symbol); }, backoffTrade);
      return;
    }
    wsTrade = socket;
    socket.onopen = function () {
      if (socket !== wsTrade) return;
      tradeOpen = true;
      backoffTrade = 1500;
      updateStatus();
    };
    socket.onmessage = function (ev) {
      if (socket !== wsTrade) return;
      try {
        const d = JSON.parse(ev.data);
        const price = parseFloat(d.p);
        const qty = parseFloat(d.q);
        // m=true significa que el comprador es el "maker" -> el agresor vendió
        const isBuy = d.m === false;
        trades.push({ t: Date.now(), price, qty, isBuy });
        lastPrice = price;
      } catch (e) {}
    };
    socket.onclose = function () {
      if (socket !== wsTrade) return;
      tradeOpen = false;
      updateStatus();
      backoffTrade = Math.min(backoffTrade * 1.6, 15000);
      reconnectTimerTrade = setTimeout(function () { connectTrade(symbol); }, backoffTrade);
    };
    socket.onerror = function () { try { socket.close(); } catch(e){} };
  }

  function connectKline(symbol) {
    if (reconnectTimerKline) { clearTimeout(reconnectTimerKline); reconnectTimerKline = null; }
    if (wsKline) { try { wsKline.onclose = null; wsKline.close(); } catch(e){} }
    klineOpen = false;
    updateStatus();
    let socket;
    try {
      socket = new WebSocket('wss://stream.binance.com:9443/ws/' + symbol + '@kline_' + TF);
    } catch (e) {
      reconnectTimerKline = setTimeout(function () { connectKline(symbol); }, backoffKline);
      return;
    }
    wsKline = socket;
    socket.onopen = function () {
      if (socket !== wsKline) return;
      klineOpen = true;
      backoffKline = 1500;
      updateStatus();
    };
    socket.onmessage = function (ev) {
      if (socket !== wsKline) return;
      try {
        const d = JSON.parse(ev.data);
        const k = d.k;
        if (!k) return;
        upsertCandle(k.t, parseFloat(k.o), parseFloat(k.h), parseFloat(k.l), parseFloat(k.c));
        lastPrice = parseFloat(k.c);
      } catch (e) {}
    };
    socket.onclose = function () {
      if (socket !== wsKline) return;
      klineOpen = false;
      updateStatus();
      backoffKline = Math.min(backoffKline * 1.6, 15000);
      reconnectTimerKline = setTimeout(function () { connectKline(symbol); }, backoffKline);
    };
    socket.onerror = function () { try { socket.close(); } catch(e){} };
  }

  function connect(symbol) {
    currentSymbol = symbol;
    trades = [];
    candles = [];
    lastPrice = null;
    loadId++;
    backoffTrade = 1500;
    backoffKline = 1500;
    statusDot.className = 'status-dot';
    statusText.textContent = 'cargando histórico…';
    symbolLabel.textContent = symbol.replace('usdt','').toUpperCase() + '/USDT · SPOT';

    loadHistory(symbol, loadId);
    connectTrade(symbol);
    connectKline(symbol);
  }

  function pruneOld() {
    const cutoff = Date.now() - windowSec * 1000;
    while (trades.length && trades[0].t < cutoff) trades.shift();
  }

  function niceStep(range, targetSteps) {
    const raw = range / targetSteps;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    let step;
    if (norm < 1.5) step = 1;
    else if (norm < 3) step = 2;
    else if (norm < 7) step = 5;
    else step = 10;
    return step * mag;
  }

  function fmtAxis(p) {
    if (p >= 1000) return p.toLocaleString('es-ES', { maximumFractionDigits: 0 });
    if (p >= 1) return p.toLocaleString('es-ES', { maximumFractionDigits: 2 });
    return p.toLocaleString('es-ES', { maximumFractionDigits: 5 });
  }

  function fmtTime(ts) {
    const d = new Date(ts);
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function updateOhlcHeader() {
    if (!candles.length) { chartOhlc.innerHTML = ''; return; }
    const c = candles[candles.length - 1];
    const chg = c.o ? ((c.c - c.o) / c.o) * 100 : 0;
    const sign = chg >= 0 ? '+' : '';
    chartOhlc.innerHTML =
      symbolLabel.textContent.split(' ')[0] + ' · ' + TF + ' &nbsp; ' +
      'O <b>' + fmtAxis(c.o) + '</b> &nbsp; H <b>' + fmtAxis(c.h) + '</b> &nbsp; ' +
      'L <b>' + fmtAxis(c.l) + '</b> &nbsp; C <b>' + fmtAxis(c.c) + '</b> &nbsp; ' +
      '<span style="color:' + (chg >= 0 ? '#7cf5b6' : '#ff8fa3') + '">' + sign + chg.toFixed(2) + '%</span>';
  }

  function drawChart() {
    const rect = canvas.getBoundingClientRect();
    const w = canvas.width = Math.max(1, Math.round(rect.width * devicePixelRatio));
    const h = canvas.height = Math.max(1, Math.round(rect.height * devicePixelRatio));
    ctx.clearRect(0, 0, w, h);
    if (candles.length < 2) return;

    let min = Infinity, max = -Infinity;
    candles.forEach(function (c) {
      if (c.l < min) min = c.l;
      if (c.h > max) max = c.h;
    });
    if (min === max) { const pad0 = (min || 1) * 0.001; min -= pad0; max += pad0; }
    const range0 = max - min;
    min -= range0 * 0.10;
    max += range0 * 0.10;
    const range = max - min;

    const isSmall = w < 380 * devicePixelRatio;
    const padLeft = (isSmall ? 40 : 54) * devicePixelRatio;
    const padRight = 6 * devicePixelRatio;
    const padTop = 26 * devicePixelRatio;
    const padBottom = 18 * devicePixelRatio;
    const plotH = h - padTop - padBottom;
    const plotW = w - padLeft - padRight;

    function y(price) {
      return padTop + (1 - (price - min) / (max - min)) * plotH;
    }

    // líneas guía horizontales con etiqueta de precio, como un gráfico normal
    const step = niceStep(range, 4);
    const first = Math.ceil(min / step) * step;
    ctx.font = (isSmall ? 9 : 10.5) * devicePixelRatio + 'px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let p = first; p <= max; p += step) {
      const gy = y(p);
      ctx.strokeStyle = 'rgba(255,255,255,0.09)';
      ctx.lineWidth = 1 * devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(padLeft, gy);
      ctx.lineTo(w - padRight, gy);
      ctx.stroke();
      ctx.fillText(fmtAxis(p), padLeft - 6 * devicePixelRatio, gy);
    }

    const n = candles.length;
    const rightMargin = Math.max(3, Math.round(n * 0.06)); // hueco a la derecha para que la última vela no se pegue al borde
    const slot = plotW / (n + rightMargin);
    const bodyW = Math.max(2.5 * devicePixelRatio, Math.min(slot * 0.62, 20 * devicePixelRatio));
    const wickW = Math.max(1 * devicePixelRatio, bodyW * 0.16);

    candles.forEach(function (c, i) {
      const cx = padLeft + slot * i + slot / 2;
      const up = c.c >= c.o;

      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = wickW;
      ctx.beginPath();
      ctx.moveTo(cx, y(c.h));
      ctx.lineTo(cx, y(c.l));
      ctx.stroke();

      const yO = y(c.o), yC = y(c.c);
      const top = Math.min(yO, yC);
      const bh = Math.max(2.5 * devicePixelRatio, Math.abs(yC - yO));
      ctx.fillStyle = up ? '#f5f7f6' : '#0a0a0a';
      ctx.fillRect(cx - bodyW / 2, top, bodyW, bh);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1 * devicePixelRatio;
      ctx.strokeRect(cx - bodyW / 2, top, bodyW, bh);
    });

    // línea de precio actual, como "AHORA" del ejemplo
    if (lastPrice != null) {
      const ly = y(lastPrice);
      ctx.setLineDash([5 * devicePixelRatio, 4 * devicePixelRatio]);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1 * devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(padLeft, ly);
      ctx.lineTo(w - padRight, ly);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(fmtAxis(lastPrice), padLeft - 6 * devicePixelRatio, ly - 8 * devicePixelRatio);
    }

    // etiquetas de hora en el eje X, como un gráfico normal
    const labelEvery = Math.max(1, Math.ceil(n / (isSmall ? 4 : 7)));
    ctx.font = (isSmall ? 8.5 : 9.5) * devicePixelRatio + 'px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    candles.forEach(function (c, i) {
      if (i % labelEvery !== 0) return;
      const cx = padLeft + slot * i + slot / 2;
      ctx.fillText(fmtTime(c.t), cx, h - padBottom + 4 * devicePixelRatio);
    });
  }

  function tick() {
    pruneOld();
    let buyVol = 0, sellVol = 0;
    trades.forEach(function (tr) {
      if (tr.isBuy) buyVol += tr.qty * tr.price; else sellVol += tr.qty * tr.price;
    });
    const total = buyVol + sellVol;
    const buyPct = total > 0 ? (buyVol / total) * 100 : 50;
    const sellPct = 100 - buyPct;
    const delta = buyVol - sellVol;

    barBuy.style.width = buyPct.toFixed(1) + '%';
    barSell.style.width = sellPct.toFixed(1) + '%';
    buyVolEl.textContent = '$' + fmtVol(buyVol);
    sellVolEl.textContent = '$' + fmtVol(sellVol);
    tradeCountEl.textContent = trades.length;
    deltaText.textContent = 'Δ ' + (delta >= 0 ? '+$' : '-$') + fmtVol(Math.abs(delta));

    if (lastPrice != null) priceEl.textContent = fmtPrice(lastPrice);

    // color de pantalla: intensidad según cuánto domina un lado, con umbral muerto cerca de 50/50
    const skew = buyPct - 50; // -50..+50
    let bg, verdict;
    if (total === 0) {
      bg = 'var(--neutral)';
      verdict = 'sin operaciones aún';
    } else if (Math.abs(skew) < 4) {
      bg = 'var(--neutral)';
      verdict = 'equilibrado';
    } else if (skew > 0) {
      const t = Math.min(skew / 40, 1);
      bg = mixColor('#0d3b2e', '#0f7a4c', t);
      verdict = skew > 20 ? 'compra dominando' : 'compra por delante';
    } else {
      const t = Math.min(-skew / 40, 1);
      bg = mixColor('#3b0d15', '#a01730', t);
      verdict = skew < -20 ? 'venta dominando' : 'venta por delante';
    }
    stage.style.backgroundColor = bg;
    document.getElementById('chartWrap').style.backgroundColor = bg;
    verdictEl.textContent = verdict;
    verdictEl.style.color = total === 0 ? 'var(--dim)' : (skew > 4 ? '#7cf5b6' : (skew < -4 ? '#ff8fa3' : 'var(--dim)'));

    drawChart();
    updateOhlcHeader();
  }

  function mixColor(c1, c2, t) {
    const a = hexToRgb(c1), b = hexToRgb(c2);
    const r = Math.round(a.r + (b.r - a.r) * t);
    const g = Math.round(a.g + (b.g - a.g) * t);
    const bl = Math.round(a.b + (b.b - a.b) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  symbolSelect.addEventListener('change', function () {
    connect(symbolSelect.value);
  });
  winButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      winButtons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      windowSec = parseInt(btn.dataset.win, 10);
    });
  });

  window.addEventListener('resize', drawChart);

  connect(symbolSelect.value);
  setInterval(tick, 300);
})();
</script>
</body>
</html>
