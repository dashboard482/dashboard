<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Financiero - Donaciones</title>
    <!-- SDK Oficial de Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --telegram-blue: #229ED9;
            --star-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .donation-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .donation-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: var(--text-color);
        }

        .donation-info span {
            font-size: 13px;
            color: var(--text-muted);
        }

        .btn-star {
            background-color: var(--star-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn-star:hover {
            opacity: 0.9;
        }

        .btn-telegram {
            display: block;
            width: 100%;
            background-color: var(--telegram-blue);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(34, 158, 217, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌟 Apoya el Hub Financiero</h1>
        <p>Mantén el proyecto activo y en constante evolución colaborando con Estrellas de Telegram (XTR).</p>

        <!-- Opción 1: Donación Pequeña -->
        <div class="donation-card">
            <div class="donation-info">
                <h3>Café para el Creador</h3>
                <span>⭐ 50 Telegram Stars</span>
            </div>
            <button class="btn-star" onclick="supportStars(50)">Donar 50</button>
        </div>

        <!-- Opción 2: Donación Moderada -->
        <div class="donation-card">
            <div class="donation-info">
                <h3>impulso Pro</h3>
                <span>⭐ 150 Telegram Stars</span>
            </div>
            <button class="btn-star" onclick="supportStars(150)">Donar 150</button>
        </div>

        <!-- Opción 3: Gran Apoyo -->
        <div class="donation-card">
            <div class="donation-info">
                <h3>Socio Fundador</h3>
                <span>⭐ 500 Telegram Stars</span>
            </div>
            <button class="btn-star" onclick="supportStars(500)">Donar 500</button>
        </div>

        <!-- Enlace directo oficial para abrir en Telegram -->
        <a href="https://t.me/anafra_bot/hubfinanciero" target="_blank" class="btn-telegram">
            📱 Abrir Hub en Telegram
        </a>

        <a href="index.html" class="back-link">← Volver al Panel Principal</a>
    </div>

    <script>
        // Inicializar Telegram WebApp si está disponible
        let tg = window.Telegram.WebApp;
        tg.expand();

        function supportStars(amount) {
            // Aquí puedes conectar la lógica con tu backend en Railway para generar la factura XTR
            if (tg && tg.openInvoice) {
                // Si el bot te devuelve una URL de factura (invoice link) generada desde Railway, la abres aquí:
                // tg.openInvoice(invoiceUrl, function(status) { ... });
                alert("Redirigiendo al sistema de pago seguro con " + amount + " Estrellas en Telegram...");
            } else {
                alert("Por favor, abre esta página como Mini App dentro de Telegram para donar con Estrellas.");
            }
        }
    </script>
</body>
</html>
