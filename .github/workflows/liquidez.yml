name: Liquidez
on:
  workflow_dispatch:
  schedule:
    - cron: "40 22 * * 1-5"
permissions:
  contents: write
jobs:
  liquidez:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar M2 en DBnomics
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          def g(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=25).read().decode("utf-8", "ignore")
          try:
              t = g("https://api.db.nomics.world/v22/datasets/FED?limit=100&offset=0&observations=0")
              print("DATASETS FED:", re.findall(r'"code":\s*"([^"]+)"', t)[:40])
          except Exception as e:
              print("datasets fallo", repr(e)[:100])
          for q in ["M2 money stock", "H6 money stock M2 seasonally adjusted", "total assets Federal Reserve"]:
              try:
                  t = g("https://api.db.nomics.world/v22/search?q=%s&limit=6" % urllib.parse.quote(q))
                  print("BUSCA", q, re.findall(r'"provider_code":\s*"([^"]+)"', t)[:6], re.findall(r'"dataset_code":\s*"([^"]+)"', t)[:6], re.findall(r'"code":\s*"([^"]+)"', t)[:6])
              except Exception as e:
                  print("busca fallo", q, repr(e)[:100])
          PY
      - name: Balance de la Fed (H.4.1)
        continue-on-error: true
        run: |
          mkdir -p historico
          python3 - <<'PY'
          import json, re, os, time, calendar, datetime, urllib.request, urllib.error
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          RUTA = "historico/fed_balance.json"
          pts = {}
          if os.path.exists(RUTA):
              try:
                  for t, v in json.load(open(RUTA))["WALCL"]:
                      pts[t] = v
              except Exception:
                  pass
          ult = max(pts) if pts else 0
          def pagina(d):
              u = "https://www.federalreserve.gov/releases/h41/%s/" % d.strftime("%Y%m%d")
              h = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=25).read().decode("utf-8", "ignore")
              h = h.replace("&nbsp;", " ").replace("&#160;", " ")
              t = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", h))
              m = re.search(r"Total assets(?:\s*[0-9]/)?[^0-9]{0,15}([0-9]{1,3}(?:,[0-9]{3})+)", t)
              if not m:
                  return None
              v = int(m.group(1).replace(",", ""))
              return v if 3000000 < v < 15000000 else None
          hoy = datetime.date.today()
          d = hoy - datetime.timedelta(days=(hoy.weekday() - 3) % 7)
          inicio = datetime.date(2019, 12, 5)
          intentos = nuevos = seguidos = 0
          while d >= inicio:
              miercoles = d - datetime.timedelta(days=1)
              t = calendar.timegm(miercoles.timetuple()) * 1000
              if t <= ult:
                  break
              v = None
              for off in (0, 1, -1):
                  try:
                      v = pagina(d + datetime.timedelta(days=off))
                      if v:
                          break
                  except urllib.error.HTTPError:
                      continue
                  except Exception as e:
                      print("fallo", d, repr(e)[:80])
                      break
              intentos += 1
              if v:
                  pts[t] = v; nuevos += 1; seguidos = 0
              else:
                  seguidos += 1
              if intentos <= 8 and nuevos == 0 and seguidos >= 8:
                  print("NO RECONOZCO EL FORMATO de la pagina; paro")
                  break
              time.sleep(0.3)
              d -= datetime.timedelta(days=7)
          lista = sorted([[t, v] for t, v in pts.items()])
          print("WALCL puntos", len(lista), "nuevos", nuevos, "ultimos", lista[-3:])
          if len(lista) > 100:
              json.dump({"WALCL": lista}, open(RUTA, "w"), separators=(",", ":"))
              print("guardado")
          else:
              print("POCOS DATOS")
              raise SystemExit(1)
          PY
      - name: Tesoro y repos inversos
        continue-on-error: true
        run: |
          mkdir -p historico
          python3 - <<'PY'
          import json, time, sys, calendar, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40).read().decode("utf-8", "ignore"))
          def ms(d):
              return calendar.timegm(time.strptime(d, "%Y-%m-%d")) * 1000
          out = {}
          # Cuenta del Tesoro en la Fed (millones de $)
          try:
              tga = {}
              base = "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/dts/operating_cash_balance"
              for page in range(1, 12):
                  q = "?filter=record_date:gte:2019-12-01&sort=record_date&page[size]=10000&page[number]=%d&fields=record_date,account_type,open_today_bal,close_today_bal" % page
                  j = get(base + q)
                  rows = j.get("data", [])
                  for r in rows:
                      at = r.get("account_type", "")
                      v = None
                      if at.startswith("Treasury General Account (TGA) Closing"):
                          v = r.get("open_today_bal")
                      elif at == "Federal Reserve Account":
                          v = r.get("close_today_bal")
                      try:
                          if v not in (None, "null"):
                              tga[r["record_date"]] = float(v)
                      except Exception:
                          pass
                  if len(rows) < 10000:
                      break
              pts = sorted([[ms(d), v] for d, v in tga.items()])
              print("TGA puntos", len(pts), pts[-1:] )
              if len(pts) > 100:
                  out["WTREGEN"] = pts
          except Exception as e:
              print("TGA fallo", repr(e)[:150])
          # Repos inversos de la Fed (miles de millones de $)
          try:
              rrp = {}
              hoy = time.strftime("%Y-%m-%d")
              for y0 in range(2019, 2027):
                  u = "https://markets.newyorkfed.org/api/rp/reverserepo/propositions/search.json?startDate=%d-01-01&endDate=%d-12-31" % (y0, y0)
                  j = get(u)
                  ops = j.get("repo", {}).get("operations", [])
                  for o in ops:
                      d = o.get("operationDate")
                      a = o.get("totalAmtAccepted")
                      if d and a is not None:
                          rrp[d] = rrp.get(d, 0) + float(a) / 1e9
                  time.sleep(1)
              pts = sorted([[ms(d), v] for d, v in rrp.items()])
              print("RRP puntos", len(pts), pts[-1:])
              if len(pts) > 100:
                  out["RRPONTSYD"] = pts
          except Exception as e:
              print("RRP fallo", repr(e)[:150])
          if out:
              json.dump(out, open("historico/liquidez_extra.json", "w"), separators=(",", ":"))
              print("guardado", list(out))
          else:
              print("NADA GUARDADO")
              sys.exit(1)
          PY
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add historico
          git diff --cached --quiet || git commit -m "liquidez"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done