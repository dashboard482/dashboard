name: Bonos

on:
  schedule:
    - cron: "40 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bonos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Descargar bonos de FRED
        run: python3 bonos.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add bonos.json
          git diff --cached --quiet || git commit -m "Actualiza bonos"
          git push