name: Senales
on:
  schedule:
    - cron: "20 */2 * * 1-5"
    - cron: "20 */8 * * 0,6"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  senales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular senales
        run: python3 senales.py
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add senales.json
          git diff --cached --quiet || (git commit -m "senales" && git pull --rebase && git push)