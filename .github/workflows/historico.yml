name: Historico
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  historico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar historia
        run: |
          mkdir -p historico
          python3 - <<'PY'
          import json, time, sys, csv, io, calendar, urllib.request, urllib.parse
          SYMS = {
            "spx": ("^GSPC", "^spx"), "ixic": ("^IXIC", "^ndq"), "dji": ("^DJI", "^dji"), "rut": ("^RUT", None),
            "ibex": ("^IBEX", "^ibex"), "dax": ("^GDAXI", "^dax"), "cac": ("^FCHI", "^cac"), "ftse": ("^FTSE", "^ukx"),
            "stoxx": ("^STOXX50E", None), "n225": ("^N225", "^nkx"), "hsi": ("^HSI", "^hsi"),
            "oro": ("GC=F", "xauusd"), "plata": ("SI=F", "xagusd"), "wti": ("CL=F", "cl.f"), "brent": ("BZ=F", None),
            "gas": ("NG=F", "ng.f"), "cobre": ("HG=F", "hg.f"),
            "btc": ("BTC-USD", "btc.v"), "eth": ("ETH-USD", "eth.v"), "sol": ("SOL-USD", None), "xrp": ("XRP-USD", "xrp.v"),
            "eurusd": ("EURUSD=X", "eurusd"), "dxy": ("DX-Y.NYB", None), "tnx": ("^TNX", None), "vix": ("^VIX", "^vix"),
            "nvda": ("NVDA", "nvda.us"), "aapl": ("AAPL", "aapl.us"), "msft": ("MSFT", "msft.us"), "tsla": ("TSLA", "tsla.us"),
            "amzn": ("AMZN", "amzn.us"), "googl": ("GOOGL", "googl.us"), "meta": ("META", "meta.us"),
          }
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36", "Accept": "*/*"}
          MIN = 1500
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40).read()
          def yahoo(sym, host):
              u = "https://%s.finance.yahoo.com/v8/finance/chart/%s?period1=0&period2=%d&interval=1d" % (host, urllib.parse.quote(sym), int(time.time()) + 86400)
              res = json.loads(get(u))["chart"]["result"][0]
              cl = res["indicators"]["quote"][0]["close"]
              return [(t, round(c, 4)) for t, c in zip(res["timestamp"], cl) if c and c > 0]
          def stooq(sym):
              txt = get("https://stooq.com/q/d/l/?s=%s&i=d" % urllib.parse.quote(sym)).decode("utf-8", "ignore")
              if not txt.startswith("Date"):
                  raise Exception("stooq respuesta: " + txt[:80].replace("\n", " "))
              out = []
              for row in csv.DictReader(io.StringIO(txt)):
                  try:
                      t = calendar.timegm(time.strptime(row["Date"], "%Y-%m-%d"))
                      c = float(row["Close"])
                      if c > 0:
                          out.append((t, round(c, 4)))
                  except Exception:
                      pass
              return out
          falta = []
          for nombre, (ys, ss) in SYMS.items():
              par = None
              for i in range(3):
                  host = ("query1", "query2")[i % 2]
                  try:
                      par = yahoo(ys, host)
                      print("yahoo ok", nombre, len(par))
                      break
                  except Exception as e:
                      print("yahoo fallo", nombre, host, repr(e)[:120])
                      time.sleep(3)
              if (not par or len(par) < MIN) and ss:
                  try:
                      par = stooq(ss)
                      print("stooq ok", nombre, len(par))
                  except Exception as e:
                      print("stooq fallo", nombre, repr(e)[:120])
                      par = None
              if par and len(par) >= MIN:
                  json.dump({"s": ys, "t": [p[0] for p in par], "c": [p[1] for p in par]}, open("historico/%s.json" % nombre, "w"), separators=(",", ":"))
              else:
                  falta.append(nombre)
              time.sleep(1)
          if falta:
              print("SIN DATOS:", falta)
          if len(falta) > 6 or "spx" in falta:
              sys.exit(1)
          PY
      - name: Descargar datos de la Fed
        continue-on-error: true
        run: |
          mkdir -p historico
          python3 - <<'PY'
          import json, time, sys, calendar, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          IDS = ["WALCL", "WTREGEN", "RRPONTSYD", "M2SL", "DTWEXBGS"]
          def baja(i):
              urls = ["https://fred.stlouisfed.org/graph/fredgraph.csv?id=%s&cosd=2015-01-01" % i, "https://fred.stlouisfed.org/data/%s.txt" % i]
              for u in urls:
                  try:
                      txt = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=20).read().decode("utf-8", "ignore")
                      pts = []
                      for f in txt.splitlines():
                          a = f.replace(",", " ").split()
                          if len(a) >= 2 and len(a[0]) == 10 and a[0][4] == "-":
                              try:
                                  t = calendar.timegm(time.strptime(a[0], "%Y-%m-%d")) * 1000
                                  v = float(a[1])
                                  if t >= 1420070400000:
                                      pts.append([t, v])
                              except Exception:
                                  pass
                      if len(pts) >= 10:
                          print("fred ok", i, u[-28:], len(pts))
                          return pts
                      print("fred pocos datos", i, len(pts))
                  except Exception as e:
                      print("fred fallo", i, u[:60], repr(e)[:100])
              return None
          out = {}
          for i in IDS:
              p = baja(i)
              if p:
                  out[i] = p
              elif not out:
                  print("FRED no responde desde GitHub, lo dejo")
                  break
          if out:
              json.dump(out, open("historico/fred.json", "w"), separators=(",", ":"))
          if len(out) < 4:
              print("FALTAN SERIES")
              sys.exit(1)
          PY
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add historico
          git diff --cached --quiet || git commit -m "historico"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done