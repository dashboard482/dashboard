<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticker en directo</title>
<style>
  :root {
    --bg: #05060a; --ink: #f2f4f8; --dim: rgba(242,244,248,0.55); --dim2: rgba(242,244,248,0.32);
    --accent: #F7931A;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden;
    font-family: 'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace; color: var(--ink); }

  #stage { position: fixed; inset: 0; height: 100dvh; display: flex; flex-direction: column;
    background: radial-gradient(ellipse at 50% 18%, var(--glow-bg, rgba(247,147,26,0.10)) 0%, rgba(0,0,0,0) 60%), var(--bg);
    transition: background 0.6s ease; }

  /* ── pestañas ── */
  #tabs { display: flex; gap: 8px; padding: calc(10px + env(safe-area-inset-top,0px)) 12px 8px;
    overflow-x: auto; flex: 0 0 auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 7px 10px 6px; border-radius: 14px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: all 0.25s ease; opacity: 0.55; }
  .tab.active { opacity: 1; background: rgba(255,255,255,0.07); border-color: var(--tab-c, #888);
    box-shadow: 0 0 14px -2px var(--tab-c, transparent); }
  .tab .badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 13px; color: #0a0a0a; }
  .tab .lbl { font-size: 9px; letter-spacing: 0.04em; color: var(--dim); font-weight: 700; }
  .tab.active .lbl { color: var(--ink); }

  /* ── zona central ── */
  #main { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; position: relative; min-height: 0; padding: 4px 16px; }

  #badgeWrap { position: relative; width: 148px; height: 148px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 2px; }
  #ring { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--c1, #F7931A), transparent 30%, var(--c1, #F7931A) 60%, transparent 90%);
    filter: blur(2px); animation: spin 5s linear infinite; opacity: 0.85; }
  #ring2 { position: absolute; inset: 10px; border-radius: 50%; background: var(--bg); }
  #coinBadge { position: relative; width: 112px; height: 112px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--c2, #ffb24d), var(--c1, #F7931A) 70%);
    display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 800;
    color: #0a0a0a; box-shadow: 0 0 40px -4px var(--c1, #F7931A), 0 0 90px -20px var(--c1, #F7931A);
    transition: box-shadow 0.4s ease; }
  #coinBadge.pulse { animation: pulse 0.5s ease; }
  @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .particles { position: absolute; inset: -20px; pointer-events: none; display: none; }
  body.is-btc .particles { display: block; }
  .particle { position: absolute; bottom: 10%; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle, #ffd98a, #F7931A 70%, transparent); opacity: 0;
    animation: rise 2.6s ease-in infinite; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(0.6); }
    15% { opacity: 1; }
    80% { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-160px) scale(1.1); }
  }
  .particle:nth-child(1) { left: 12%; animation-delay: 0.0s; }
  .particle:nth-child(2) { left: 28%; animation-delay: 0.5s; }
  .particle:nth-child(3) { left: 46%; animation-delay: 1.0s; }
  .particle:nth-child(4) { left: 62%; animation-delay: 0.3s; }
  .particle:nth-child(5) { left: 78%; animation-delay: 0.8s; }
  .particle:nth-child(6) { left: 90%; animation-delay: 1.4s; }
  .particle:nth-child(7) { left: 20%; animation-delay: 1.8s; }
  .particle:nth-child(8) { left: 68%; animation-delay: 2.1s; }

  #symbolLabel { font-size: 13px; letter-spacing: 0.12em; color: var(--dim); font-weight: 700; }

  #price { font-size: clamp(42px, 13vw, 92px); font-weight: 800; line-height: 1; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; transition: text-shadow 0.25s ease, color 0.25s ease; }
  #price.flash-up { color: #22e08a; text-shadow: 0 0 24px rgba(34,224,138,0.75); }
  #price.flash-down { color: #ff4d6d; text-shadow: 0 0 24px rgba(255,77,109,0.75); }

  #change { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #change.up { color: #22e08a; } #change.down { color: #ff4d6d; }

  #hilo { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 2px; }
  #hilo b { color: var(--ink); }

  #sparkWrap { width: min(520px, 92vw); height: 70px; margin-top: 10px; flex: 0 0 auto; }
  canvas#spark { width: 100%; height: 100%; display: block; }

  #status { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 6px 16px calc(10px + env(safe-area-inset-bottom,0px)); font-size: 10.5px; color: var(--dim2); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
  .dot.live { background: #22e08a; box-shadow: 0 0 8px #22e08a; }
  .dot.err { background: #ff4d6d; }
</style>
</head>
<body>
<div id="stage">
  <div id="tabs"></div>

  <div id="main">
    <div class="particles">
      <span class="particle"></span><span class="particle"></span><span class="particle"></span>
      <span class="particle"></span><span class="particle"></span><span class="particle"></span>
      <span class="particle"></span><span class="particle"></span>
    </div>
    <div id="badgeWrap">
      <div id="ring"></div><div id="ring2"></div>
      <div id="coinBadge">₿</div>
    </div>
    <div id="symbolLabel">BTC / USDT</div>
    <div id="price">$ —</div>
    <div id="change">—</div>
    <div id="hilo">H <b id="hiVal">—</b> &nbsp; L <b id="loVal">—</b></div>
    <div id="sparkWrap"><canvas id="spark"></canvas></div>
  </div>

  <div id="status"><span class="dot" id="statusDot"></span><span id="statusText">conectando…</span></div>
</div>

<script>
(function () {
  'use strict';

  const COINS = [
    { sym: 'BTC', pair: 'BTCUSDT', c1: '#F7931A', c2: '#ffb24d', glyph: '₿', spectacular: true },
    { sym: 'ETH', pair: 'ETHUSDT', c1: '#8aa0c8', c2: '#cfd9ec', glyph: 'Ξ' },
    { sym: 'SOL', pair: 'SOLUSDT', c1: '#9945FF', c2: '#14F195', glyph: 'S' },
    { sym: 'XRP', pair: 'XRPUSDT', c1: '#4b5563', c2: '#9ca3af', glyph: 'X' },
    { sym: 'HBAR', pair: 'HBARUSDT', c1: '#3b1f5c', c2: '#b48bff', glyph: 'ℏ' },
    { sym: 'HYPE', pair: 'HYPEUSDT', c1: '#0ea5a0', c2: '#6ff0e0', glyph: 'H' },
    { sym: 'BNB', pair: 'BNBUSDT', c1: '#f3ba2f', c2: '#ffe08a', glyph: 'B' },
    { sym: 'DOGE', pair: 'DOGEUSDT', c1: '#c2a633', c2: '#f0d878', glyph: 'Ð' },
    { sym: 'ADA', pair: 'ADAUSDT', c1: '#0033ad', c2: '#5c7cf0', glyph: 'A' },
    { sym: 'AVAX', pair: 'AVAXUSDT', c1: '#e84142', c2: '#ff8a8a', glyph: 'A' },
    { sym: 'LINK', pair: 'LINKUSDT', c1: '#2a5ada', c2: '#8fb0ff', glyph: 'L' },
    { sym: 'DOT', pair: 'DOTUSDT', c1: '#e6007a', c2: '#ff8ac2', glyph: 'D' },
    { sym: 'LTC', pair: 'LTCUSDT', c1: '#345d9d', c2: '#9cb8e6', glyph: 'Ł' },
    { sym: 'TRX', pair: 'TRXUSDT', c1: '#ff0013', c2: '#ff8a90', glyph: 'T' },
    { sym: 'UNI', pair: 'UNIUSDT', c1: '#ff007a', c2: '#ff8ac2', glyph: 'U' },
    { sym: 'ATOM', pair: 'ATOMUSDT', c1: '#2e3148', c2: '#8f96c2', glyph: '⚛' },
    { sym: 'NEAR', pair: 'NEARUSDT', c1: '#17d9d4', c2: '#a0f5f2', glyph: 'N' },
    { sym: 'SUI', pair: 'SUIUSDT', c1: '#4da2ff', c2: '#b3d9ff', glyph: 'S' },
    { sym: 'TON', pair: 'TONUSDT', c1: '#0098ea', c2: '#8fd4ff', glyph: 'T' },
    { sym: 'PEPE', pair: 'PEPEUSDT', c1: '#4caf50', c2: '#a8e6aa', glyph: '🐸' },
  ];

  const tabsEl = document.getElementById('tabs');
  const stageEl = document.getElementById('stage');
  const badgeEl = document.getElementById('coinBadge');
  const symbolLabelEl = document.getElementById('symbolLabel');
  const priceEl = document.getElementById('price');
  const changeEl = document.getElementById('change');
  const hiEl = document.getElementById('hiVal');
  const loEl = document.getElementById('loVal');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const canvas = document.getElementById('spark');
  const ctx = canvas.getContext('2d');

  let current = COINS[0];
  let ws = null, reconnectTimer = null, backoff = 1200;
  let lastPrice = null;
  let history = [];

  function fmtPrice(p, pair) {
    const dec = p >= 1000 ? 2 : p >= 1 ? 4 : p >= 0.001 ? 6 : 8;
    return '$' + p.toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }

  function buildTabs() {
    COINS.forEach((c) => {
      const el = document.createElement('div');
      el.className = 'tab' + (c === current ? ' active' : '');
      el.style.setProperty('--tab-c', c.c1);
      el.innerHTML = `<div class="badge" style="background:radial-gradient(circle at 35% 30%, ${c.c2}, ${c.c1} 70%)">${c.glyph}</div><div class="lbl">${c.sym}</div>`;
      el.addEventListener('click', () => selectCoin(c));
      el.dataset.sym = c.sym;
      tabsEl.appendChild(el);
    });
  }

  function selectCoin(c) {
    if (c === current) return;
    current = c;
    [...tabsEl.children].forEach((el) => el.classList.toggle('active', el.dataset.sym === c.sym));
    badgeEl.textContent = c.glyph;
    badgeEl.style.setProperty('--c1', c.c1);
    badgeEl.style.setProperty('--c2', c.c2);
    document.getElementById('ring').style.setProperty('--c1', c.c1);
    symbolLabelEl.textContent = c.sym + ' / USDT';
    stageEl.style.setProperty('--glow-bg', hexToRgba(c.c1, 0.10));
    document.body.classList.toggle('is-btc', !!c.spectacular);
    lastPrice = null;
    history = [];
    priceEl.textContent = '$ —';
    changeEl.textContent = '—';
    changeEl.className = '';
    hiEl.textContent = '—'; loEl.textContent = '—';
    connect(c.pair);
  }

  function hexToRgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return `rgba(${r},${g},${b},${a})`;
  }

  function drawSpark() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width = Math.max(1, Math.round(rect.width * dpr));
    const h = canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.clearRect(0, 0, w, h);
    if (history.length < 2) return;
    let min = Infinity, max = -Infinity;
    for (const p of history) { if (p < min) min = p; if (p > max) max = p; }
    if (min === max) { min -= 1; max += 1; }
    const pad = 6 * dpr;
    const up = history[history.length - 1] >= history[0];
    const col = up ? '#22e08a' : '#ff4d6d';
    ctx.beginPath();
    history.forEach((p, i) => {
      const x = (i / (history.length - 1)) * (w - pad * 2) + pad;
      const y = h - pad - ((p - min) / (max - min)) * (h - pad * 2);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = col; ctx.lineWidth = 2.4 * dpr; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.shadowColor = col; ctx.shadowBlur = 8 * dpr;
    ctx.stroke();
  }

  function onTick(d) {
    const price = parseFloat(d.c);
    const changePct = parseFloat(d.P);
    const hi = parseFloat(d.h), lo = parseFloat(d.l);
    if (isNaN(price)) return;

    if (lastPrice !== null && price !== lastPrice) {
      const dir = price > lastPrice ? 'up' : 'down';
      priceEl.classList.remove('flash-up', 'flash-down');
      void priceEl.offsetWidth;
      priceEl.classList.add(dir === 'up' ? 'flash-up' : 'flash-down');
      badgeEl.classList.remove('pulse'); void badgeEl.offsetWidth; badgeEl.classList.add('pulse');
      clearTimeout(onTick._t);
      onTick._t = setTimeout(() => priceEl.classList.remove('flash-up', 'flash-down'), 550);
    }
    lastPrice = price;
    priceEl.textContent = fmtPrice(price);
    changeEl.textContent = (changePct >= 0 ? '▲ +' : '▼ ') + changePct.toFixed(2) + '% (24h)';
    changeEl.className = changePct >= 0 ? 'up' : 'down';
    hiEl.textContent = fmtPrice(hi); loEl.textContent = fmtPrice(lo);

    history.push(price);
    if (history.length > 200) history.shift();
    drawSpark();
  }

  function connect(pair) {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
    backoff = 1200;
    statusDot.className = 'dot'; statusText.textContent = 'conectando…';
    openSocket(pair);
  }

  function openSocket(pair) {
    if (current.pair !== pair) return;
    let socket;
    try { socket = new WebSocket('wss://stream.binance.com:9443/ws/' + pair.toLowerCase() + '@ticker'); }
    catch (e) { reconnectTimer = setTimeout(() => openSocket(pair), backoff); return; }
    ws = socket;
    socket.onopen = () => { if (socket !== ws) return; backoff = 1200; statusDot.className = 'dot live'; statusText.textContent = 'en directo'; };
    socket.onmessage = (ev) => {
      if (socket !== ws) return;
      try { onTick(JSON.parse(ev.data)); } catch (e) {}
    };
    socket.onerror = () => { try { socket.close(); } catch (e) {} };
    socket.onclose = () => {
      if (socket !== ws) return;
      statusDot.className = 'dot err'; statusText.textContent = 'reconectando…';
      backoff = Math.min(backoff * 1.6, 15000);
      reconnectTimer = setTimeout(() => openSocket(pair), backoff);
    };
  }

  window.addEventListener('resize', drawSpark);

  buildTabs();
  document.body.classList.add('is-btc');
  badgeEl.style.setProperty('--c1', current.c1);
  badgeEl.style.setProperty('--c2', current.c2);
  document.getElementById('ring').style.setProperty('--c1', current.c1);
  stageEl.style.setProperty('--glow-bg', hexToRgba(current.c1, 0.10));
  connect(current.pair);
})();
</script>
</body>
</html>
