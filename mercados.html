<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>Mapas de Mercado - Hub Financiero</title>
<style>
:root{--bg:#0e1117;--panel:#131722;--panel2:#1a1e29;--border:#2a2e39;--ink:#d1d4dc;--strong:#f0f3fa;--dim:#787b86;--accent:#2962ff;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--panel:#fff;--panel2:#eef1f7;--border:#dde1ea;--ink:#363a45;--strong:#0e1117;--dim:#6b6f7c;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:calc(12px + max(env(safe-area-inset-top,0px),var(--tgtop,0px))) 12px calc(24px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.back{display:inline-flex;align-items:center;font-size:13px;color:var(--strong);text-decoration:none;background:var(--panel2);border:1px solid var(--border);padding:6px 12px;border-radius:6px}
header span{font-size:11px;color:var(--dim);letter-spacing:.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:var(--panel2);color:var(--ink);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.box{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
#w{width:100%}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--dim);font-size:13px;line-height:1.5;pointer-events:none}
.desc{font-size:11px;color:var(--dim);margin:10px 2px 0;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="back" href="index.html">← Hub</a><span>MAPAS DE CALOR EN VIVO</span></header>
  <div class="tabs" id="tabs"></div>
  <div class="box"><div id="w"></div><div id="msg">Cargando mapa…</div></div>
  <div class="desc" id="desc"></div>
</div>

<script>
(function(){
'use strict';
var BASE='https://s3.tradingview.com/external-embedding/';
var MAPAS=[
 {id:'spx',n:'S&P 500',w:'embed-widget-stock-heatmap.js',c:{dataSource:'SPX500',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Las 500 mayores empresas de EEUU por sector. El tamaño es la capitalización y el color la variación del día.'},
 {id:'ndx',n:'Nasdaq 100',w:'embed-widget-stock-heatmap.js',c:{dataSource:'NASDAQ100',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Las 100 mayores empresas del Nasdaq (tecnología y crecimiento).'},
 {id:'dow',n:'Dow Jones',w:'embed-widget-stock-heatmap.js',c:{dataSource:'DJCA',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Las 30 empresas del Dow Jones Industrial Average.'},
 {id:'rus',n:'Russell 3000',w:'embed-widget-stock-heatmap.js',c:{dataSource:'TVCRUA',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Las 3.000 mayores empresas de EEUU, cerca del 98% del mercado.'},
 {id:'usa',n:'Todo EEUU',w:'embed-widget-stock-heatmap.js',c:{dataSource:'AllUSA',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Todas las empresas cotizadas en EEUU.'},
 {id:'esp',n:'España',w:'embed-widget-stock-heatmap.js',c:{dataSource:'AllES',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Empresas cotizadas en la bolsa española.'},
 {id:'ger',n:'Alemania',w:'embed-widget-stock-heatmap.js',c:{dataSource:'AllDE',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Empresas cotizadas en la bolsa alemana.'},
 {id:'fra',n:'Francia',w:'embed-widget-stock-heatmap.js',c:{dataSource:'AllFR',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Empresas cotizadas en la bolsa francesa.'},
 {id:'gbr',n:'Reino Unido',w:'embed-widget-stock-heatmap.js',c:{dataSource:'AllGB',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Empresas cotizadas en la bolsa británica.'},
 {id:'ita',n:'Italia',w:'embed-widget-stock-heatmap.js',c:{dataSource:'AllIT',grouping:'sector',blockSize:'market_cap_basic',blockColor:'change'},d:'Empresas cotizadas en la bolsa italiana.'},
 {id:'cri',n:'Cripto',w:'embed-widget-crypto-coins-heatmap.js',c:{dataSource:'Crypto',blockSize:'market_cap_calc',blockColor:'change'},d:'Criptomonedas por capitalización. El color es la variación del día.'},
 {id:'etf',n:'ETF',w:'embed-widget-etf-heatmap.js',c:{dataSource:'AllUSEtf',blockSize:'aum',blockColor:'change',grouping:'asset_class'},d:'ETF de EEUU por activos bajo gestión, agrupados por clase de activo.'}
];
var $=function(i){return document.getElementById(i)};
var cur=null;
try{cur=localStorage.getItem('mapas.tab')}catch(e){}
if(!MAPAS.some(function(m){return m.id===cur}))cur='spx';

function oscuro(){return !(window.matchMedia&&matchMedia('(prefers-color-scheme:light)').matches)}
function alto(){return Math.max(420,Math.min(720,window.innerHeight-170))}

function cargar(){
  var m=MAPAS.filter(function(x){return x.id===cur})[0],box=$('w');
  box.innerHTML='';
  var cont=document.createElement('div');cont.className='tradingview-widget-container';
  var inner=document.createElement('div');inner.className='tradingview-widget-container__widget';cont.appendChild(inner);
  var cfg={locale:'es',symbolUrl:'',colorTheme:oscuro()?'dark':'light',hasTopBar:true,isTransparent:true,width:'100%',height:alto()};
  for(var k in m.c)cfg[k]=m.c[k];
  var s=document.createElement('script');s.type='text/javascript';s.async=true;s.src=BASE+m.w;s.text=JSON.stringify(cfg);
  cont.appendChild(s);box.appendChild(cont);
  box.style.minHeight=alto()+'px';
  $('msg').style.display='flex';$('msg').textContent='Cargando mapa…';
  $('desc').textContent=m.d;
  var t=Date.now(),chk=setInterval(function(){
    if(box.querySelector('iframe')){$('msg').style.display='none';clearInterval(chk)}
    else if(Date.now()-t>10000){$('msg').textContent='No se ha podido cargar el mapa. Comprueba la conexión o vuelve a pulsar la pestaña.';clearInterval(chk)}
  },400);
}
function pestañas(){
  var t=$('tabs');t.innerHTML='';
  MAPAS.forEach(function(m){
    var b=document.createElement('button');b.textContent=m.n;if(m.id===cur)b.className='on';
    b.addEventListener('click',function(){cur=m.id;try{localStorage.setItem('mapas.tab',cur)}catch(e){}pestañas();cargar()});
    t.appendChild(b);
  });
  var on=t.querySelector('.on');if(on&&on.scrollIntoView)try{on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
pestañas();cargar();
if(window.matchMedia)try{matchMedia('(prefers-color-scheme:light)').addEventListener('change',cargar)}catch(e){}
var rt,w0=window.innerWidth;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(window.innerWidth!==w0){w0=window.innerWidth;cargar()}},300)});
})();
</script>
<script src="telegram.js" defer></script>
</body>
</html>
