<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>Trivial Financiero - Hub Financiero</title>
<style>
:root{--bg:#0e1117;--panel:#161b26;--panel2:#1d2332;--border:#2a3144;--ink:#d5d9e4;--strong:#f4f6fb;--dim:#8089a0;--accent:#4f8cff;--ok:#26c281;--bad:#ef5350;--gold:#f5b942;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--panel:#fff;--panel2:#eef1f7;--border:#dde1ea;--ink:#2b303c;--strong:#0e1117;--dim:#6b7285;--accent:#2f6df0;--ok:#16a06a;--bad:#d93a37;--gold:#c98a0c;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.btn{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--strong);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.big{width:100%;padding:14px;font-size:16px}
h1{font-size:22px;margin:0;color:var(--strong);letter-spacing:-.3px}
h2{font-size:16px;margin:20px 0 8px;color:var(--strong)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
.player{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lvl{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8a5cff);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pinfo{flex:1;min-width:0}
.pinfo b{color:var(--strong);font-size:15px}
.pinfo small{display:block;color:var(--dim);font-size:12px}
.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.mode:active{transform:scale(.98)}
.mode .ic{font-size:26px}
.mode b{display:block;color:var(--strong);margin:6px 0 2px;font-size:15px}
.mode small{color:var(--dim);font-size:12px;line-height:1.35;display:block}
.mode.wide{grid-column:1/-1;display:flex;gap:12px;align-items:center;border-color:var(--gold)}
.mode.wide.done{border-color:var(--border);opacity:.85}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;display:flex;align-items:center;gap:8px}
.cat small{display:block;color:var(--dim);font-size:11px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:13px;color:var(--dim)}
.hud b{color:var(--strong)}
.prog{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;width:100%;background:var(--ok);transform-origin:left}
.qcat{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.qtxt{font-size:19px;line-height:1.35;color:var(--strong);font-weight:650;margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{font:inherit;text-align:left;background:var(--panel);border:1.5px solid var(--border);color:var(--ink);border-radius:12px;padding:13px 14px;font-size:15px;cursor:pointer;line-height:1.3;transition:background .15s,border-color .15s}
.opt:active{transform:scale(.99)}
.opt.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);border-color:var(--ok);color:var(--strong)}
.opt.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);border-color:var(--bad);color:var(--strong)}
.opt.off{opacity:.3;pointer-events:none}
.opt:disabled{cursor:default}
.expl{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--panel2);border-left:4px solid var(--accent);font-size:14px;line-height:1.5}
.expl.ok{border-left-color:var(--ok)}.expl.bad{border-left-color:var(--bad)}
.expl b{color:var(--strong)}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1}
.hearts{letter-spacing:2px}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font-weight:800;font-size:22px;color:var(--gold);pointer-events:none;animation:pop .9s ease-out forwards;z-index:30}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.res{text-align:center}
.res .emo{font-size:54px}
.res .score{font-size:44px;font-weight:800;color:var(--strong);line-height:1.1}
.res .rank{color:var(--gold);font-weight:700;margin:2px 0 6px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel2);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-size:19px;color:var(--strong)}
.stat small{font-size:11px;color:var(--dim)}
.rev{text-align:left;margin-top:8px}
.rev .item{padding:10px 0;border-top:1px solid var(--border);font-size:13.5px;line-height:1.45}
.rev .item small{color:var(--dim);display:block}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;color:var(--dim)}
.badge .e{font-size:24px;display:block;filter:grayscale(1);opacity:.35}
.badge.on{color:var(--strong)}.badge.on .e{filter:none;opacity:1}
.catbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.catbar span:first-child{width:118px;flex:0 0 auto}
.catbar .bar{flex:1;margin:0}
.catbar em{width:38px;text-align:right;font-style:normal;color:var(--dim);font-size:12px}
.hide{display:none!important}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:16px;padding:20px;width:min(92vw,460px);max-height:84vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.qt{font-size:18px;line-height:1.45;color:var(--strong);font-style:italic;margin:6px 0 10px}
.qa{color:var(--accent);font-weight:700;font-size:14px}
.qm{color:var(--dim);font-size:12px;margin-top:2px}
.warn{color:var(--gold);font-size:12px;margin-top:8px}
.foot{margin-top:22px;font-size:11px;color:var(--dim);text-align:center;line-height:1.5}
.tabs2{display:flex;gap:6px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="btn sm" id="back" href="index.html">← Hub</a>
  <h1>🧠 Trivial Financiero</h1>
  <button class="btn sm" id="sndBtn" title="Sonido y vibración">📳</button>
</header>

<!-- INICIO -->
<section id="home">
  <div class="card">
    <div class="player">
      <div class="lvl" id="lvl">1</div>
      <div class="pinfo"><b id="rankName">Aprendiz</b><small id="xpTxt"></small><div class="bar"><i id="xpBar"></i></div></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <h2>Jugar</h2>
  <div class="modes" id="modes"></div>

  <h2>Por categoría</h2>
  <div class="cats" id="cats"></div>

  <h2>Más</h2>
  <div class="row" style="margin-top:0">
    <button class="btn" id="goStats">📊 Mis estadísticas</button>
    <button class="btn" id="goQuotes">💡 Frases de sabiduría</button>
  </div>
  <div class="foot">Contenido educativo, no es asesoramiento financiero.<br><span id="qCount"></span></div>
</section>

<!-- JUEGO -->
<section id="game" class="hide">
  <div class="hud"><button class="btn sm" id="quit">✕ Salir</button><span id="hudMid"></span><span id="hudR"></span></div>
  <div class="prog"><i id="prog"></i></div>
  <div class="timer"><i id="timer"></i></div>
  <div id="qbox">
    <div class="qcat" id="qcat"></div>
    <p class="qtxt" id="qtxt"></p>
    <div class="opts" id="opts"></div>
    <div id="explBox"></div>
    <div class="row" id="gameRow">
      <button class="btn" id="fifty">✂️ 50/50</button>
      <button class="btn pri hide" id="next">Siguiente →</button>
    </div>
  </div>
</section>

<!-- RESULTADO -->
<section id="result" class="hide"></section>

<!-- ESTADISTICAS -->
<section id="stats" class="hide">
  <div class="hud"><button class="btn sm" id="stBack">← Volver</button><b>Mis estadísticas</b><span></span></div>
  <div id="statsBody"></div>
</section>
</div>

<dialog id="qd">
  <div class="hud"><b>💡 Sabiduría de mercado</b><button class="btn sm" id="qClose">Cerrar</button></div>
  <div id="qBody"></div>
  <div class="row"><button class="btn" id="qNew">🎲 Otra frase</button><button class="btn" id="qShare">Compartir</button></div>
  <div class="warn">Algunas frases se atribuyen popularmente a estas personas, pero su autoría exacta es dudosa.</div>
</dialog>

<script>

 hist:['🏛️','Historia'],inv:['🦈','Grandes inversores'],trad:['📈','Trading'],macro:['🏦','Macroeconomía'],

};
var RAW=[["hist",1,"¿En qué año se produjo el crash bursátil del «Jueves Negro», que marcó el inicio de la Gran Depresión?",["1914","1929","1933","1950"],1,"El 24 de octubre de 1929 (Jueves Negro) arrancó el hundimiento de Wall Street, que se agravó el «Martes Negro», el día 29."],["hist",2,"El 19 de octubre de 1987, el «Lunes Negro», el Dow Jones se desplomó en un solo día aproximadamente…",["un 5%","un 12%","un 22%","un 40%"],2,"Cayó cerca de un 22,6%, la mayor caída diaria en porcentaje de su historia."],["hist",1,"¿En qué país se originó la «tulipomanía», una de las primeras burbujas especulativas conocidas (1637)?",["Inglaterra","Países Bajos","Francia","España"],1,"En los Países Bajos, donde los bulbos de tulipán llegaron a venderse a precios desorbitados antes de hundirse."],["hist",1,"¿En qué año quebró Lehman Brothers, detonante de la crisis financiera global?",["2001","2006","2008","2012"],2,"Se declaró en quiebra el 15 de septiembre de 2008, la mayor suspensión de pagos de la historia de EE. UU. hasta entonces."],["hist",2,"El acuerdo de Bretton Woods (1944) estableció un sistema monetario basado en…",["El bitcoin","El dólar convertible en oro y el resto de monedas ligadas al dólar","El euro","La libra esterlina como moneda única"],1,"Se fijaron tipos de cambio ligados al dólar, convertible en oro. De ahí nacieron también el FMI y el Banco Mundial."],["hist",2,"¿En qué año suspendió EE. UU. la convertibilidad del dólar en oro (el «shock de Nixon»)?",["1944","1971","1987","2001"],1,"En 1971 acabó el sistema de Bretton Woods y se abrió la era de las monedas fiat con tipos de cambio flotantes."],["hist",1,"¿Qué índice bursátil simbolizó la burbuja «puntocom» que estalló en el año 2000?",["Dow Jones","IBEX 35","Nasdaq Composite","Nikkei 225"],2,"El Nasdaq tocó su máximo en marzo de 2000 y llegó a perder cerca del 78% hasta 2002."],["hist",3,"¿Qué compañía holandesa fundada en 1602 se considera la primera empresa que emitió acciones negociables en bolsa?",["Compañía Neerlandesa de las Indias Orientales (VOC)","Compañía de los Mares del Sur","Banco de Ámsterdam","Compañía de la Bahía de Hudson"],0,"La VOC emitió acciones que se compraban y vendían en la bolsa de Ámsterdam, de ahí que se la considere pionera."],["hist",2,"La crisis financiera asiática de 1997 comenzó con la devaluación de la moneda de…",["Japón","Tailandia","China","Corea del Sur"],1,"El baht tailandés dejó de estar ligado al dólar en julio de 1997 y la crisis se contagió a toda la región."],["hist",3,"El «Miércoles Negro» de 1992 obligó a la libra esterlina a abandonar…",["El patrón oro","El Mecanismo de Tipos de Cambio europeo (SME)","El FMI","La OTAN"],1,"George Soros apostó fuerte contra la libra y se le atribuyen ganancias cercanas a los 1.000 millones de dólares."],["hist",2,"¿Qué famoso científico perdió una gran suma en la burbuja de los Mares del Sur (1720)?",["Albert Einstein","Isaac Newton","Galileo Galilei","Charles Darwin"],1,"Se le atribuye la frase «puedo calcular el movimiento de los astros, pero no la locura de los hombres»."],["hist",3,"La Bolsa de Nueva York nació con el «Acuerdo del Buttonwood» (1792). ¿Dónde se firmó?",["En una taberna de Londres","Bajo un árbol de Wall Street","En el Capitolio","En un banco de Filadelfia"],1,"Un grupo de 24 corredores lo firmó bajo un árbol buttonwood (plátano americano) en Wall Street."],["hist",2,"¿Qué caracterizó al «Flash Crash» del 6 de mayo de 2010?",["Un cierre de mercados de una semana","Una caída de unos 1.000 puntos del Dow en minutos, con recuperación casi inmediata","Una quiebra bancaria","Un ataque informático al Nasdaq"],1,"El Dow cayó cerca de 1.000 puntos en pocos minutos y recuperó gran parte en la misma sesión, por una mezcla de algoritmos y falta de liquidez."],["hist",2,"¿Cuál de estos países NO pidió un rescate soberano a la UE/FMI durante la crisis de deuda europea?",["Grecia","Irlanda","Portugal","Italia"],3,"Grecia, Irlanda y Portugal recibieron programas de rescate. Italia sufrió mucha presión en los mercados, pero no fue rescatada."],["hist",1,"¿En qué año empezaron a circular los billetes y monedas de euro?",["1999","2000","2002","2004"],2,"El euro nació como moneda contable en 1999 y circuló físicamente el 1 de enero de 2002."],["hist",3,"Tras el máximo de 1929, ¿cuánto tardó el Dow Jones en volver a superarlo?",["Unos 5 años","Unos 10 años","Unos 25 años","Unos 50 años"],2,"No recuperó el máximo de 1929 hasta noviembre de 1954."],["inv",2,"¿Qué fondo, fundado por el matemático Jim Simons, es famoso por la rentabilidad de su Medallion Fund con modelos cuantitativos?",["Bridgewater Associates","Renaissance Technologies","Citadel","BlackRock"],1,"Renaissance Technologies. Medallion obtuvo rentabilidades históricas altísimas y, desde hace años, solo gestiona dinero de empleados."],["inv",1,"¿A qué inversor se le conoce como el «Oráculo de Omaha»?",["George Soros","Ray Dalio","Warren Buffett","Charlie Munger"],2,"Warren Buffett, presidente de Berkshire Hathaway, que tiene su sede en Omaha (Nebraska)."],["inv",2,"¿Quién «rompió el Banco de Inglaterra» en 1992 apostando contra la libra?",["Stanley Druckenmiller","Paul Tudor Jones","George Soros","Carl Icahn"],2,"George Soros, con su Quantum Fund (Stanley Druckenmiller era su gestor jefe)."],["inv",2,"¿Qué gestor dirigió el fondo Magellan de Fidelity con rentabilidades espectaculares y popularizó el «invierte en lo que conoces»?",["Peter Lynch","John Bogle","Philip Fisher","John Templeton"],0,"Peter Lynch gestionó Magellan entre 1977 y 1990."],["inv",1,"¿Quién es considerado el padre del «value investing» y fue maestro de Warren Buffett?",["Benjamin Graham","Jesse Livermore","Harry Markowitz","Ed Seykota"],0,"Benjamin Graham, autor de «Security Analysis» (con David Dodd) y de «El inversor inteligente»."],["inv",2,"¿Quién fue durante décadas el vicepresidente y mano derecha de Buffett en Berkshire Hathaway?",["Charlie Munger","Bill Gates","Ray Dalio","Peter Thiel"],0,"Charlie Munger, defensor de comprar empresas excelentes a un precio razonable."],["inv",2,"¿Quién fundó Bridgewater Associates y escribió el libro «Principios»?",["Ray Dalio","Ken Griffin","Steve Cohen","Bill Ackman"],0,"Ray Dalio, que también popularizó la idea de la cartera «All Weather»."],["inv",2,"¿Qué gestor, fundador de Scion Capital, apostó contra las hipotecas subprime antes de 2008, como se relata en «La gran apuesta»?",["Michael Burry","Carl Icahn","David Tepper","Seth Klarman"],0,"Michael Burry, interpretado en la película por Christian Bale."],["inv",2,"¿Quién fundó Vanguard y lanzó en 1976 el primer fondo indexado para pequeños inversores?",["John Bogle","Peter Lynch","Charles Schwab","Warren Buffett"],0,"John Bogle. Su filosofía: bajos costes, diversificación y largo plazo."],["inv",3,"«Reminiscencias de un especulador», de Edwin Lefèvre, se inspira en la vida de…",["Jesse Livermore","J. P. Morgan","Cornelius Vanderbilt","Joseph Kennedy"],0,"Jesse Livermore, legendario especulador de principios del siglo XX."],["inv",3,"¿Qué inversor es famoso como «activista» corporativo, con historias como TWA o Apple?",["Carl Icahn","Peter Lynch","Mario Gabelli","Jim Rogers"],0,"Carl Icahn compraba participaciones importantes para presionar por cambios en las empresas."],["inv",2,"¿Qué gestor de Pershing Square apostó públicamente en corto contra Herbalife en 2012?",["Bill Ackman","Seth Klarman","Dan Loeb","Jim Chanos"],0,"Bill Ackman. Carl Icahn tomó la posición contraria, en largo."],["inv",3,"¿Qué gestor, antiguo socio de Soros, es famoso por casi 30 años sin ningún año de pérdidas al frente de Duquesne Capital?",["Stanley Druckenmiller","Paul Tudor Jones","Julian Robertson","Louis Bacon"],0,"Stanley Druckenmiller, referente del trading macro."],["inv",2,"¿A qué se dedicaba originalmente Berkshire Hathaway antes de que Buffett la convirtiera en un holding?",["Seguros","Ferrocarriles","Textil","Petróleo"],2,"Era una empresa textil. Buffett acabó reconociendo que fue una mala inversión y la usó como vehículo para comprar otros negocios."],["inv",3,"¿Quién escribe los famosos «memos» de Oaktree Capital que muchos inversores leen con devoción?",["Howard Marks","Ray Dalio","Seth Klarman","Jeremy Grantham"],0,"Howard Marks, cofundador de Oaktree, famoso por insistir en entender el ciclo y el riesgo."],["inv",3,"¿Quién es el autor de «Acciones ordinarias y beneficios extraordinarios», pilar de la inversión en crecimiento?",["Philip Fisher","Benjamin Graham","John Neff","Burton Malkiel"],0,"Philip Fisher, cuya obra también influyó mucho en Buffett."],["trad",2,"En trading, ¿qué mide el indicador ATR (Average True Range)?",["La tendencia","La volatilidad","El volumen oculto","El interés abierto"],1,"El ATR mide el rango medio de movimiento del precio, es decir, su volatilidad. No indica dirección."],["trad",1,"¿Qué es un «short squeeze»?",["Una subida violenta porque los vendedores en corto se ven obligados a recomprar","Una caída por pánico","El cierre de un exchange","Una corrección del 10%"],0,"Quienes apostaron a la baja compran para cerrar posiciones, lo que empuja el precio aún más arriba."],["trad",1,"En el RSI clásico (0-100), ¿a partir de qué nivel se suele hablar de «sobrecompra»?",["30","50","70","90"],2,"Por encima de 70, sobrecompra; por debajo de 30, sobreventa. Ninguno de los dos niveles es una señal por sí solo."],["trad",2,"La «cruz de la muerte» (death cross) se produce cuando…",["La media de 50 sesiones cruza por debajo de la de 200","La media de 50 cruza por encima de la de 200","El RSI llega a 0","El precio toca un máximo histórico"],0,"Es el cruce bajista de la media de 50 con la de 200. Es una señal que llega tarde y puede fallar."],["trad",2,"La «cruz dorada» (golden cross) se produce cuando…",["La media de 50 sesiones cruza por encima de la de 200","La media de 50 cruza por debajo de la de 200","El precio dobla su valor","El volumen se duplica"],0,"Es el cruce alcista de la media de 50 sobre la de 200."],["trad",1,"¿Qué es un soporte?",["Un nivel donde el precio ha tendido a frenar sus caídas","Un tipo de orden","Un dividendo","Una comisión"],0,"Un soporte es una zona donde históricamente han aparecido compradores. Si se pierde, puede dejar de funcionar."],["trad",1,"¿Para qué sirve una orden stop-loss?",["Para limitar la pérdida cerrando la posición si el precio llega a un nivel","Para comprar siempre más barato","Para cobrar dividendos","Para garantizar beneficios"],0,"Ojo: con saltos bruscos (gaps) puede ejecutarse a un precio peor que el fijado."],["trad",2,"Según la regla clásica de gestión del riesgo, ¿qué porcentaje de la cuenta se suele arriesgar como máximo por operación?",["10-15%","50%","1-2%","Da igual si hay apalancamiento"],2,"La regla habitual es no arriesgar más del 1-2% del capital en una sola operación."],["trad",2,"¿Qué es el VWAP?",["El precio medio ponderado por volumen","La volatilidad semanal","Un índice de miedo","Una media móvil de 200 periodos"],0,"Es el precio medio al que se ha negociado un activo desde el inicio de la sesión, dando más peso a los tramos con más volumen."],["trad",3,"Las bandas de Bollinger se sitúan, por defecto, a cuántas desviaciones estándar de la media móvil?",["1","2","3","5"],1,"Por defecto: media móvil de 20 periodos y bandas a 2 desviaciones estándar."],["trad",3,"El MACD se calcula a partir de la diferencia entre dos medias móviles exponenciales de…",["12 y 26 periodos","5 y 10","20 y 50","100 y 200"],0,"EMA de 12 menos EMA de 26; la línea de señal es una EMA de 9 de esa diferencia."],["trad",1,"En una vela japonesa, el «cuerpo» representa…",["La diferencia entre apertura y cierre","El volumen","El precio máximo","La fecha"],0,"El cuerpo va de la apertura al cierre; las mechas muestran los máximos y mínimos."],["trad",2,"Una vela «doji» (apertura y cierre casi iguales) suele interpretarse como…",["Indecisión","Euforia","Pánico vendedor","Un dividendo"],0,"Muestra equilibrio entre compradores y vendedores, pero su significado depende del contexto."],["trad",2,"¿Qué es un «gap» en un gráfico?",["Un hueco entre el cierre anterior y la apertura siguiente","Una vela verde larga","Un tipo de indicador","Una comisión de bróker"],0,"Aparece cuando el precio abre lejos del cierre anterior, por ejemplo tras una noticia fuera de horario."],["trad",2,"¿Qué es el «slippage» (deslizamiento)?",["La diferencia entre el precio esperado y el precio al que se ejecuta la orden","La pérdida por comisiones","Un tipo de apalancamiento","Un cierre en festivo"],0,"Es habitual en mercados volátiles o poco líquidos."],["trad",2,"Con apalancamiento 10x en una posición larga, y sin tener en cuenta márgenes de mantenimiento, ¿qué caída del precio se lleva aproximadamente todo el margen?",["Un 1%","Un 10%","Un 50%","Un 90%"],1,"Con 10x, un movimiento del 10% en contra liquida el margen. A mayor apalancamiento, más cerca está el precio de liquidación."],["trad",1,"El «spread» de un activo es…",["La diferencia entre el precio de compra y el de venta (bid/ask)","La variación anual","El dividendo","El volumen diario"],0,"Es un coste implícito de operar; es menor en activos muy líquidos."],["trad",3,"¿Cuál es el nivel de retroceso de Fibonacci más famoso, ligado a la razón áurea?",["23,6%","50%","61,8%","100%"],2,"El 61,8% es el más citado, junto al 38,2%. El 50% se usa mucho, pero no es un ratio de Fibonacci."],["trad",2,"¿Qué garantiza una orden límite de compra?",["Que no pagarás más del precio fijado (aunque puede no ejecutarse)","Que se ejecutará siempre","Que ganarás dinero","Que no habrá comisiones"],0,"Controla el precio, pero no asegura la ejecución."],["macro",2,"¿Cómo se llama la política por la que un banco central compra activos (bonos) para inyectar liquidez y bajar tipos a largo plazo?",["Quantitative Easing (QE)","Margin call","Reverse repo","Short squeeze"],0,"Es la expansión cuantitativa (QE). Su contraria, retirar liquidez, se llama QT."],["macro",2,"Una «curva de tipos invertida» significa que…",["Los tipos a corto plazo superan a los de largo plazo","Los tipos a largo superan a los de corto","Todos los tipos son cero","El banco central ha cerrado"],0,"Históricamente ha precedido a muchas recesiones, aunque con retrasos variables y no siempre."],["macro",1,"¿Qué mide el IPC?",["La evolución de los precios de una cesta de bienes y servicios de consumo","El empleo","El PIB","La deuda pública"],0,"Índice de Precios de Consumo: es la medida de inflación más usada."],["macro",1,"Se habla de «recesión técnica» cuando el PIB…",["Cae dos trimestres consecutivos","Cae un mes","Crece un 0%","Cae un año entero"],0,"Dos trimestres seguidos de caída del PIB. En EE. UU., la declaración oficial la hace el NBER con más criterios."],["macro",2,"El doble mandato de la Reserva Federal es…",["Máximo empleo y estabilidad de precios","Crecimiento y déficit cero","Tipo de cambio fijo y superávit","Controlar bolsa y cripto"],0,"Pleno empleo y estabilidad de precios (inflación en torno al 2%)."],["macro",1,"¿En qué ciudad tiene su sede el Banco Central Europeo?",["Bruselas","Fráncfort","París","Madrid"],1,"Fráncfort del Meno, en Alemania."],["macro",2,"¿Qué inflación a medio plazo se marca como objetivo el BCE?",["0%","2%","5%","10%"],1,"Un 2% simétrico a medio plazo."],["macro",2,"La «estanflación» combina…",["Inflación alta y estancamiento económico","Deflación y crecimiento","Pleno empleo y precios estables","Boom bursátil y tipos negativos"],0,"Es el escenario típico de los años 70: precios al alza, crecimiento débil y paro elevado."],["macro",1,"¿Cuál es la referencia habitual de las hipotecas variables en España?",["Euríbor","IBEX 35","Libor del dólar","Bund"],0,"El Euríbor es el tipo al que los bancos europeos se prestan entre sí."],["macro",3,"¿Qué es el «tapering»?",["La reducción gradual de las compras de activos del banco central","Una subida de tipos de un punto","Un tipo de impuesto","Un fondo de rescate"],0,"Es retirar poco a poco el estímulo del QE, sin vender los bonos ya comprados."],["macro",1,"¿Qué es la deflación?",["Una bajada generalizada y sostenida de los precios","Una subida de precios","La devaluación de una moneda","Un tipo de bono"],0,"Puede frenar el consumo, porque la gente espera precios más bajos mañana."],["macro",2,"Si los tipos de interés suben, el precio de los bonos ya emitidos suele…",["Bajar","Subir","Quedarse igual","Duplicarse"],0,"Porque los nuevos bonos pagan más y los antiguos pierden atractivo."],["macro",2,"En España, la «prima de riesgo» compara el bono a 10 años español con el de…",["Alemania","EE. UU.","Japón","Francia"],0,"Se mide frente al bono alemán (Bund), la referencia de deuda segura en Europa."],["macro",3,"¿Qué divisa tiene más peso en la cesta del índice dólar (DXY)?",["El euro","El yen","La libra","El franco suizo"],0,"El euro pesa en torno al 57%, por eso el DXY se mueve mucho con el EUR/USD."],["macro",3,"En la Fed, el «dot plot» muestra…",["Las proyecciones de tipos de interés de los miembros del comité","Los resultados de las empresas","Las ventas minoristas","La cotización del oro"],0,"Cada punto es la previsión de tipos de un miembro del FOMC para los próximos años."],["macro",2,"¿Qué informe de empleo de EE. UU. se publica normalmente el primer viernes de cada mes?",["Las nóminas no agrícolas (NFP)","El IPC","El PIB","La confianza del consumidor"],0,"Non-Farm Payrolls: uno de los datos que más mueve los mercados."],["cripto",2,"¿En qué año se minó el bloque génesis de Bitcoin?",["2008","2009","2010","2011"],1,"El 3 de enero de 2009. El whitepaper se había publicado en octubre de 2008."],["cripto",1,"¿Cuál es el suministro máximo de bitcoins?",["21 millones","100 millones","1.000 millones","No tiene límite"],0,"Está fijado en el protocolo: 21 millones de BTC."],["cripto",1,"¿Cada cuánto, aproximadamente, se produce un halving de Bitcoin?",["Cada mes","Cada año","Cada 4 años (~210.000 bloques)","Cada 10 años"],2,"Cada 210.000 bloques, unos 4 años, la recompensa por bloque se reduce a la mitad."],["cripto",2,"Tras el halving de abril de 2024, ¿cuál es la recompensa por bloque minado?",["12,5 BTC","6,25 BTC","3,125 BTC","1,5625 BTC"],2,"Pasó de 6,25 a 3,125 BTC."],["cripto",2,"¿Cuántos satoshis hay en 1 bitcoin?",["1.000","1 millón","100 millones","1.000 millones"],2,"1 BTC = 100.000.000 satoshis."],["cripto",2,"¿Qué cambió Ethereum con «The Merge» en 2022?",["Pasó de prueba de trabajo (PoW) a prueba de participación (PoS)","Duplicó su suministro","Cambió de nombre","Se fusionó con Bitcoin"],0,"Dejó de minarse con potencia de cálculo y pasó a validarse con ETH en «staking»."],["cripto",2,"¿Qué se compró el 22 de mayo de 2010 en la famosa transacción de 10.000 BTC?",["Dos pizzas","Un coche","Una casa","Un reloj"],0,"Hoy se celebra como el «Bitcoin Pizza Day»."],["cripto",3,"¿Qué titular del periódico The Times incluyó Satoshi en el bloque génesis?",["«Chancellor on brink of second bailout for banks»","«Bitcoin to the moon»","«Stock market crash»","«Fed cuts rates»"],0,"Fecha el bloque y se suele interpretar como una crítica a los rescates bancarios."],["cripto",1,"¿Qué exchange cripto quebró en noviembre de 2022 tras el escándalo de su fundador Sam Bankman-Fried?",["FTX","Coinbase","Kraken","Binance"],0,"FTX se declaró en quiebra tras descubrirse un agujero enorme en sus cuentas."],["cripto",2,"¿En qué mes y año fueron aprobados en EE. UU. los primeros ETF de Bitcoin spot?",["Enero de 2024","Marzo de 2020","Junio de 2021","Diciembre de 2022"],0,"La SEC los aprobó en enero de 2024."],["cripto",1,"¿Qué es una stablecoin?",["Un token que intenta mantener su valor ligado a otro activo, como el dólar","Una moneda que sube siempre","Un tipo de minero","Un monedero físico"],0,"USDT y USDC son ejemplos. Pueden perder la paridad si falla su respaldo."],["cripto",2,"La «dominancia de Bitcoin» es…",["El porcentaje de la capitalización total cripto que representa BTC","El número de mineros","Su precio en dólares","La cantidad de BTC en exchanges"],0,"Se usa para ver si el pondera por el precio de la acción, no por capitalización."],["emp",1,"¿Qué es una IPO (oferta pública inicial)?",["La primera salida de una empresa a bolsa","Un tipo de dividendo","Una fusión","Una quiebra"],0,"Es cuando una empresa vende sus acciones al público por primera vez."],["emp",1,"¿Qué es un dividendo?",["Parte del beneficio que la empresa reparte entre sus accionistas","Un impuesto","Una comisión","Una deuda"],0,"No todas las empresas lo reparten; algunas reinvierten todo el beneficio."],["emp",2,"¿Qué mide el PER (P/E)?",["Precio de la acción entre beneficio por acción","Deuda entre capital","Dividendo entre precio","Ventas entre empleados"],0,"Indica cuántos años de beneficios actuales paga el mercado por la empresa."],["emp",1,"¿Cómo se calcula la capitalización bursátil?",["Precio de la acción × número de acciones","Beneficio × 10","Ventas − costes","Activos − deuda"],0,"Es el valor total que el mercado asigna a la empresa."],["emp",2,"¿Qué empresa fue la primera en superar el billón de dólares de capitalización, en 2018?",["Apple","Amazon","Microsoft","Saudi Aramco"],0,"Lo hizo en agosto de 2018. «Billón» en español es «trillion» en inglés."],["emp",2,"¿Qué acción es famosa por cotizar a cientos de miles de dólares por título?",["Berkshire Hathaway (clase A)","Apple","Tesla","Coca-Cola"],0,"Buffett nunca ha hecho split de las acciones A, por eso su precio es tan alto."],["emp",1,"¿Qué comunidad de Reddit impulsó el «short squeeze» de GameStop en enero de 2021?",["r/wallstreetbets","r/investing","r/bitcoin","r/personalfinance"],0,"Miles de pequeños inversores compraron a la vez, y muchos fondos con posiciones cortas sufrieron fuertes pérdidas."],["emp",2,"Si una empresa hace un «split» 2 por 1, ¿qué ocurre con el valor total de tu inversión?",["Se mantiene igual (doble de acciones, precio a la mitad)","Se duplica","Se reduce a la mitad","Se pierde"],0,"Un split no crea valor: solo cambia el número de acciones y su precio."],["emp",1,"¿Qué animal simboliza un mercado bajista?",["El oso","El toro","El lobo","El águila"],0,"El oso ataca de arriba abajo; el toro, de abajo arriba."],["emp",2,"¿Qué es el VIX, el «índice del miedo»?",["La volatilidad esperada del S&P 500 a 30 días","El volumen del Nasdaq","La inflación","El precio del petróleo"],0,"Sube cuando aumenta la incertidumbre y suele dispararse en caídas bruscas."],["emp",1,"¿Qué es un ETF?",["Un fondo cotizado en bolsa que suele replicar un índice","Un tipo de bono","Una criptomoneda","Un bróker"],0,"Se compra y se vende en bolsa como una acción y permite diversificar con una sola operación."],["emp",2,"¿Cuál de estas empresas NO forma parte de las «Siete Magníficas» (Magnificent Seven)?",["Nvidia","Meta","Netflix","Tesla"],2,"Son Apple, Microsoft, Alphabet, Amazon, Nvidia, Meta y Tesla."],["conc",2,"Según la «regla del 72», ¿cuántos años tarda en duplicarse una inversión al 8% anual?",["3","9","15","25"],1,"72 ÷ 8 = 9 años, de forma aproximada."],["conc",1,"¿Qué significa diversificar?",["Repartir el riesgo entre distintos activos","Comprar solo lo que más sube","Invertir todo en una empresa","Vender en pánico"],0,"La idea es que un mal resultado en un activo no hunda toda la cartera."],["conc",2,"Invertir una cantidad fija a intervalos regulares se conoce como…",["Dollar-cost averaging (aportaciones periódicas)","Market timing","Arbitraje","Venta en corto"],0,"Reduce el riesgo de entrar justo en un mal momento, pero no elimina el riesgo de mercado."],["conc",2,"¿Qué es el TER de un fondo?",["El coste total anual como porcentaje del patrimonio","El tipo de cambio","La rentabilidad esperada","El plazo mínimo"],0,"Una diferencia pequeña de comisiones se acumula mucho a largo plazo."],["conc",1,"¿Qué busca un fondo indexado?",["Replicar un índice","Superar siempre al mercado","Invertir solo en oro","Evitar las acciones"],0,"Replicar la rentabilidad de un índice a bajo coste."],["conc",1,"En general, a mayor rentabilidad esperada…",["Mayor riesgo","Menor riesgo","No hay relación","Más liquidez"],0,"Nadie ofrece rentabilidad alta sin riesgo: desconfía cuando lo prometen."],["conc",3,"¿Qué mide el ratio de Sharpe?",["La rentabilidad ajustada por el riesgo","El dividendo","La liquidez","La inflación"],0,"Compara el exceso de rentabilidad sobre la libre de riesgo con la volatilidad."],["conc",2,"Un inversor «value» busca…",["Empresas que cotizan por debajo de su valor intrínseco","Las que más han subido","Solo cripto","Opciones a corto plazo"],0,"Intenta comprar «un dólar por 50 centavos», en palabras de Graham."],["conc",3,"El «margen de seguridad» de Graham consiste en…",["Comprar con un descuento sobre el valor estimado de la empresa","Usar siempre stop-loss","Tener efectivo permanentemente","Evitar los bonos"],0,"Sirve de colchón por si la estimación del valor resulta equivocada."],["conc",1,"La «liquidez» de un activo es…",["La facilidad para venderlo rápido sin perder valor","Su rentabilidad","Su riesgo","Su dividendo"],0,"El efectivo es lo más líquido; un inmueble, bastante menos."],["conc",3,"Dos activos con correlación −1 se mueven…",["En direcciones opuestas","Igual","De forma independiente","Siempre al alza"],0,"Correlación +1: igual; 0: independientes; −1: opuestos."],["conc",2,"¿Qué es rebalancear una cartera?",["Ajustar los pesos para volver a la distribución objetivo","Vender todo","Comprar más del que más sube","Cambiar de bróker"],0,"Por ejemplo, vender algo de lo que más ha subido y reforzar lo que ha quedado por debajo de su peso."],["conc",2,"El «drawdown» es…",["La caída desde un máximo hasta un mínimo posterior","La subida anual","Un tipo de orden","Un dividendo"],0,"El «máximo drawdown» mide la peor caída histórica de un activo o una cartera."],["conc",2,"Si tu cuenta paga un 1% y la inflación es del 3%, tu rentabilidad real es aproximadamente…",["+4%","+1%","−2%","0%"],2,"Rentabilidad real ≈ nominal − inflación: 1% − 3% = −2%."],["conc",2,"Una cartera «60/40» clásica es…",["60% acciones y 40% bonos","6 function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

function seedRng(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
 return function(){h+=0x6D2B79F5;var t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function haptic(t){if(!S.snd)return;try{if(tg&&tg.HapticFeedback){if(t==='ok')tg.HapticFeedback.notificationOccurred('success');else if(t==='bad')tg.HapticFeedback.notificationOccurred('error');else tg.HapticFeedback.impactOccurred('light');return}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(t==='bad'?[60,40,60]:t==='ok'?25:10)}catch(e){}}
var ac;function beep(f,d){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function sfx(t){if(t==='ok'){beep(660,.12);setTimeout(function(){beep(880,.15)},90)}else if(t==='bad')beep(180,.28)}

/* ---------- partida ---------- */
var G=null,tmr=null,tmrStart=0,Q_TIME=20000;
function pick(mode,cat){
  var pool=QS.slice(),rng=null,n=10;
  if(mode==='diario'){rng=seedRng('hub'+today());n=5;pool=shuffle(pool,rng).slice(0,5);return pool}
  if(mode==='cat'){pool=pool.filter(function(q){return q.cat===cat})}
  if(mode==='mix'){pool=pool.filter(function(q){return q.d>=2});}
  // prioriza preguntas no vistas
  var nuevas=pool.filter(function(q){return !S.seen[q.id]}),vistas=pool.filter(function(q){return S.seen[q.id]});
  if(mode==='clasico'||mode==='cat'||mode==='mix'){
    var ord=shuffle(nuevas).concat(shuffle(vistas));
    if(mode==='cat')n=Math.min(10,pool.length);
    var sel=ord.slice(0,n);
    return sel.sort(function(a,b){return a.d-b.d+(Math.random()-.5)});
  }
  // tiempo y vida: orden creciente de dificultad aproximada, mezclado
  var s=shuffle(nuevas).concat(shuffle(vistas));
  if(mode==='vida'){var f=s.filter(function(q){return q.d===1}),m=s.filter(function(q){return q.d===2}),d=s.filter(function(q){return q.d===3});
    s=shuffle(f.slice(0,8).concat(m.slice(0,6))).concat(shuffle(f.slice(8).concat(m.slice(6)).concat(d)))}
  return s;
}
function start(mode,cat){
  if(mode==='diario'&&S.daily[today()]){toast('Ya has jugado el reto de hoy. ¡Vuelve mañana!');return}
  var qs=pick(mode,cat);
  G={mode:mode,cat:cat||null,qs:qs,i:0,pts:0,ok:0,combo:0,maxCombo:0,lives:3,t:60,wrong:[],fiftyUsed:false,done:false,fast:0,locked:false,xpStart:S.xp,total:0};
  show('game');
  var timed=mode==='tiempo';
  $('timer').parentNode.style.display='';
  $('fifty').classList.toggle('hide',timed||mode==='diario'&&false);
  $('fifty').disabled=false;$('fifty').style.opacity=1;
  if(timed){G.deadline=Date.now()+60000;G.total=0;tickGlobal()}
  nextQ();
}
function toast(t){var p=document.createElement('div');p.className='pop';p.style.fontSize='15px';p.style.color='var(--strong)';p.textContent=t;document.body.appendChild(p);setTimeout(function(){p.remove()},1000)}
function pop(t,c){var p=document.createElement('div');p.className='pop';p.textContent=t;if(c)p.style.color=c;document.body.appendChild(p);setTimeout(function(){p.remove()},900)}
function hud(){
  var m=G.mode,t='';
  if(m==='vida')t='<span class="hearts">'+'❤️'.repeat(G.lives)+'🖤'.repeat(3-G.lives)+'</span>';
  else if(m==='tiempo')t='⏱ <b id="gt">'+Math.max(0,Math.ceil((G.deadline-Date.now())/1000))+'</b> s';
  else t='Pregunta <b>'+(G.i+1)+'</b>/'+G.qs.length;
  $('hudMid').innerHTML=t;
  $('hudR').innerHTML='⭐ <b>'+G.pts+'</b>'+(G.combo>=2?' · 🔥x'+G.combo:'');
  var pr=(m==='tiempo'||m==='vida')?0:(G.i/G.qs.length*100);
  $('prog').style.width=pr+'%';
  $('prog').parentNode.style.display=(m==='tiempo'||m==='vida')?'none':'';
}
function tickGlobal(){
  clearInterval(G.gt);
  G.gt=setInterval(function(){
    if(!G||G.done){clearInterval(G&&G.gt);return}
    var r=Math.ceil((G.deadline-Date.now())/1000);var e=$('gt');if(e)e.textContent=Math.max(0,r);
    var f=Math.max(0,(G.deadline-Date.now())/60000);var tb=$('timer');tb.style.transform='scaleX('+Math.min(1,f)+')';tb.style.background=f<.25?'var(--bad)':'var(--ok)';
    if(r<=0){clearInterval(G.gt);G.locked=true;finish()}
  },200);
}
function nextQ(){
  if(G.mode==='tiempo'){if(Date.now()>=G.deadline){finish();return}}
  if(G.i>=G.qs.length){if(G.mode==='tiempo'||G.mode==='vida'){G.qs=G.qs.concat(shuffle(QS))}else{finish();return}}
  var q=G.qs[G.i];
  var order=shuffle([0,1,2,3]);
  G.cur={q:q,order:order,answered:false,t0:Date.now()};
  $('qcat').textContent=CATS[q.cat][0]+' '+CATS[q.cat][1]+' · '+['','Fácil','Media','Difícil'][q.d];
  $('qtxt').textContent=q.q;
  var h='';order.forEach(function(oi,pos){h+='<button class="opt" data-p="'+pos+'">'+esc(q.o[oi])+'</button>'});
  $('opts').innerHTML=h;$('explBox').innerHTML='';
  $('next').classList.add('hide');
  if(G.mode!=='tiempo'){$('fifty').classList.remove('hide');$('fifty').disabled=G.fiftyUsed;$('fifty').style.opacity=G.fiftyUsed?.4:1}
  Array.prototype.forEach.call($('opts').children,function(b){b.onclick=function(){answer(+b.getAttribute('data-p'))}});
  G.locked=false;hud();
  if(G.mode!=='tiempo')startQTimer();
}
function startQTimer(){
  clearInterval(tmr);tmrStart=Date.now();var tb=$('timer');tb.style.transform='scaleX(1)';tb.style.background='var(--ok)';
  tmr=setInterval(function(){
    var f=1-(Date.now()-tmrStart)/Q_TIME;tb.style.transform='scaleX('+Math.max(0,f)+')';
    tb.style.background=f<.3?'var(--bad)':f<.6?'var(--gold)':'var(--ok)';
    if(f<=0){clearInterval(tmr);answer(-1)}
  },100);
}
function answer(pos){
  if(!G||G.locked||G.cur.answered)return;
  G.locked=true;G.cur.answered=true;clearInterval(tmr);
  var c=G.cur,q=c.q,corPos=c.order.indexOf(q.c);
  var ok=pos===corPos,el=Date.now()-c.t0;
  var btns=$('opts').children;
  Array.prototype.forEach.call(btns,function(b,i){b.disabled=true;if(i===corPos)b.classList.add('ok');else if(i===pos)b.classList.add('bad');else b.classList.add('off')});
  S.answered++;S.seen[q.id]=1;
  var cs=S.cat[q.cat]||[0,0];cs[1]++;
  if(ok){
    S.correct++;cs[0]++;G.ok++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    var base=100,bonus=0;
    if(G.mode!=='tiempo'){bonus=Math.round(Math.max(0,1-el/Q_TIME)*50)}
    var mult=1+Math.min(G.combo-1,5)*.1;
    var gain=Math.round((base+bonus)*mult*(q.d===3?1.3:q.d===2?1.1:1));
    if(G.mode==='tiempo'||G.mode==='vida'){gain=10*q.d+Math.min(G.combo,10)}
    G.pts+=gain;pop('+'+gain);haptic('ok');sfx('ok');
    if(el<5000){G.fast++;S.fast++}
    if(G.mode==='tiempo'){G.deadline+=2000}
    S.maxCombo=Math.max(S.maxCombo,G.maxCombo);
  }else{
    G.combo=0;G.wrong.push({q:q,sel:pos>=0?q.o[c.order[pos]]:null});haptic('bad');sfx('bad');
    $('qbox').classList.remove('shake');void $('qbox').offsetWidth;$('qbox').classList.add('shake');
    if(G.mode==='vida'){G.lives--}
    if(G.mode==='tiempo'){G.deadline-=3000}
  }
  S.cat[q.cat]=cs;
  var head=ok?'✅ <b>¡Correcto!</b> ':(pos<0?'⌛ <b>Tiempo agotado.</b> ':'❌ <b>Incorrecto.</b> ');
  $('explBox').innerHTML='<div class="expl '+(ok?'ok':'bad')+'">'+head+esc(q.e)+'</div>';
  hud();save();
  var fin=(G.mode==='vida'&&G.lives<=0)||(G.mode==='tiempo'&&Date.now()>=G.deadline)||(G.mode!=='tiempo'&&G.mode!=='vida'&&G.i>=G.qs.length-1);
  var nx=$('next');nx.classList.remove('hide');nx.textContent=fin?'Ver resultado →':'Siguiente →';
  nx.onclick=function(){G.i++;if(fin)finish();else nextQ()};
  if(G.mode==='tiempo'&&!fin){ // avance rápido: sin pausa larga
    nx.textContent='Siguiente →';
  }
  $('fifty').classList.add('hide');
}
$('fifty').onclick=function(){
  if(!G||G.fiftyUsed||G.locked||G.mode==='tiempo')return;
  G.fiftyUsed=true;var c=G.cur,cor=c.order.indexOf(c.q.c);
  var wr=[0,1,2,3].filter(function(i){return i!==cor});wr=shuffle(wr).slice(0,2);
  wr.forEach(function(i){var b=$('opts').children[i];b.classList.add('off')});
  $('fifty').disabled=true;$('fifty').style.opacity=.4;haptic();
};
$('quit').onclick=function(){if(!G)return;clearInterval(tmr);clearInterval(G.gt);G.done=true;G=null;renderHome();show('home')};

/* ---------- final ---------- */
function titulo(p){return p>=.95?['🏆','Leyenda de Wall Street']:p>=.8?['🦈','Tiburón financiero']:p>=.6?['📈','Inversor sólido']:p>=.4?['📚','Aprendiendo rápido']:['🌱','Aprendiz con ganas']}
function finish(){
  if(!G||G.done)return;G.done=true;clearInterval(tmr);clearInterval(G.gt);
  var g=G,m=g.mode,nq=m==='tiempo'||m==='vida'?(g.ok+g.wrong.length):g.qs.length;
  var pct=nq?g.ok/nq:0;
  var score=(m==='tiempo'||m==='vida')?g.ok:g.pts;
  var key=m==='cat'?'cat:'+g.cat:m;
  var rec=S.best[key];var nuevoRec=false;
  var cmp=(m==='tiempo'||m==='vida')?g.ok:g.pts;
  if(m!=='diario'&&(rec==null||cmp>rec)){S.best[key]=cmp;nuevoRec=rec!=null}
  if(m==='tiempo'||m==='vida'){S.best[m]=Math.max(S.best[m]||0,g.ok)}
  var xp=Math.round(g.ok*12+(m==='tiempo'||m==='vida'?0:g.pts/20)+(pct===1&&nq>=5?40:0)+10);
  if(m==='diario'){
    xp+=30;S.daily[today()]={s:g.ok,p:g.pts};
    if(S.lastDay===yest())S.streak++;else if(S.lastDay!==today())S.streak=1;
    S.lastDay=today();S.bestStreak=Math.max(S.bestStreak,S.streak);
  }
  if(pct===1&&nq>=5){S.perfect++}
  var before=lvlInfo(S.xp).l;
  S.xp+=xp;S.games++;
  S.hist.push({d:today(),m:m,s:score,ok:g.ok,n:nq});if(S.hist.length>30)S.hist.shift();
  var after=lvlInfo(S.xp).l;
  var nb=checkBadges();save();
  var t=titulo(pct);
  var h='<div class="card res"><div class="emo">'+t[0]+'</div>';
  h+='<div class="score">'+((m==='tiempo'||m==='vida')?g.ok+' <span style="font-size:18px;color:var(--dim)">aciertos</span>':g.pts+' <span style="font-size:18px;color:var(--dim)">pts</span>')+'</div>';
  h+='<div class="rank">'+t[1]+(nuevoRec?' · 🏆 ¡Nuevo récord!':'')+'</div>';
  h+='<div class="stats3"><div class="stat"><b>'+g.ok+'/'+nq+'</b><small>aciertos</small></div><div class="stat"><b>x'+g.maxCombo+'</b><small>mejor combo</small></div><div class="stat"><b>+'+xp+'</b><small>XP</small></div></div>';
  if(after>before)h+='<div class="expl ok" style="text-align:left">🎉 <b>¡Subes al nivel '+after+'!</b> Ahora eres «'+rankOf(after)+'».</div>';
  if(m==='diario')h+='<div class="expl" style="text-align:left;margin-top:8px">🔥 Racha de <b>'+S.streak+'</b> '+(S.streak===1?'día':'días')+'.</div>';
  nb.forEach(function(b){h+='<div class="expl ok" style="text-align:left;margin-top:8px">'+b[1]+' <b>Insignia: '+b[2]+'</b></div>'});
  h+='<div class="row"><button class="btn pri" id="again">🔁 Jugar otra vez</button><button class="btn" id="share">📤 Compartir</button></div>';
  h+='<div class="row"><button class="btn" id="toHome">Inicio</button></div></div>';
  if(g.wrong.length){h+='<h2>Para repasar ('+g.wrong.length+')</h2><div class="card rev">';
    g.wrong.forEach(function(w){h+='<div class="item"><b style="color:var(--strong)">'+esc(w.q.q)+'</b><small>'+(w.sel?'Tu respuesta: '+esc(w.sel)+' ❌':'Sin responder ⌛')+'</small><small style="color:var(--ok)">Correcta: '+esc(w.q.o[w.q.c])+'</small><small>'+esc(w.q.e)+'</small></div>'});
    h+='</div>'}
  $('result').innerHTML=h;show('result');
  var again=g.mode,gc=g.cat;
  $('again').onclick=function(){if(again==='diario'){renderHome();show('home');return}start(again,gc)};
  $('toHome').onclick=function(){renderHome();show('home')};
  $('share').onclick=function(){compartir(g,nq,score)};
  if(pct>=.8){haptic('ok')}
  G=null;
}
function compartir(g,nq,score){
  var mn={diario:'Reto diario',clasico:'Clásico',tiempo:'Contrarreloj',vida:'Supervivencia',mix:'Aleatorio difícil',cat:'Categoría'}[g.mode];
  var txt='🧠 Trivial Financiero · '+mn+'\n'+g.ok+'/'+nq+' aciertos · '+g.pts+' pts · combo x'+g.maxCombo+(g.mode==='diario'?'\n🔥 Racha: '+S.streak+' d':'')+'\n¿Me superas?';
  var url='https://t.me/anafra_bot/hubfinanciero?startapp=trivia';
  var link='https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(txt);
  try{if(tg&&tg.openTelegramLink){tg.openTelegramLink(link);return}}catch(e){}
  if(navigator.share){navigator.share({text:txt,url:url}).catch(function(){});return}
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(txt+' '+url),'_blank');
}

/* ---------- estadísticas ---------- */
function renderStats(){
  var acc=S.answered?Math.round(S.correct/S.answered*100):0;
  var li=lvlInfo(S.xp);
  var h='<div class="card"><div class="stats3" style="margin:0"><div class="stat"><b>'+li.l+'</b><small>nivel</small></div><div class="stat"><b>'+S.games+'</b><small>partidas</small></div><div class="stat"><b>'+acc+'%</b><small>aciertos</small></div></div>';
  h+='<div class="stats3" style="margin-bottom:0"><div class="stat"><b>'+S.bestStreak+'</b><small>mejor racha (d)</small></div><div class="stat"><b>'+S.maxCombo+'</b><small>mejor combo</small></div><div class="stat"><b>'+S.xp+'</b><small>XP total</small></div></div></div>';
  h+='<h2>Por categoría</h2><div class="card">';
  Object.keys(CATS).forEach(function(k){var cs=S.cat[k]||[0,0],p=cs[1]?Math.round(cs[0]/cs[1]*100):0;
    h+='<div class="catbar"><span>'+CATS[k][0]+' '+CATS[k][1]+'</span><div class="bar"><i style="width:'+p+'%;background:'+(p>=70?'var(--ok)':p>=40?'var(--gold)':'var(--bad)')+'"></i></div><em>'+(cs[1]?p+'%':'–')+'</em></div>'});
  h+='</div>';
  var f=Object.keys(CATS).filter(function(k){return (S.cat[k]||[0,0])[1]>=5}).sort(function(a,b){return S.cat[a][0]/S.cat[a][1]-S.cat[b][0]/S.cat[b][1]});
  if(f.length>1)h+='<div class="foot" style="text-align:left;font-size:13px;margin-top:8px">💡 Tu punto débil: <b>'+CATS[f[0]][1]+'</b>. Tu punto fuerte: <b>'+CATS[f[f.length-1]][1]+'</b>.</div>';
  h+='<h2>Récords</h2><div class="card"><div class="chips" style="margin:0">';
  var any=false;Object.keys(S.best).forEach(function(k){any=true;var n=k.indexOf('cat:')===0?CATS[k.slice(4)][1]:{clasico:'Clásico',tiempo:'Contrarreloj',vida:'Supervivencia',mix:'Aleatorio difícil'}[k]||k;h+='<span class="chip">'+n+': <b>'+S.best[k]+'</b></span>'});
  if(!any)h+='<span class="chip">Aún sin récords</span>';
  h+='</div></div><h2>Insignias</h2><div class="badges">';
  BADGES.forEach(function(b){h+='<div class="badge'+(S.badges[b[0]]?' on':'')+'"><span class="e">'+b[1]+'</span>'+b[2]+'</div>'});
  h+='</div><div class="row"><button class="btn" id="reset">🗑️ Borrar progreso</button></div>';
  $('statsBody').innerHTML=h;
  $('reset').onclick=function(){if(S._rc){S=def();save();renderStats();renderHome();toast('Progreso borrado')}else{S._rc=1;$('reset').textContent='Pulsa otra vez para confirmar';setTimeout(function(){delete S._rc;if($('reset'))$('reset').textContent='🗑️ Borrar progreso'},3000)}};
}
$('goStats').onclick=function(){renderStats();show('stats')};
$('stBack').onclick=function(){renderHome();show('home')};

/* ---------- frases ---------- */
var qi=0;
function showQuote(){var q=QUOTES[qi];$('qBody').innerHTML='<div class="qt">«'+esc(q[0])+'»</div><div class="qa">— '+esc(q[1])+'</div><div class="qm">'+esc(q[2])+'</div>'}
function openQuote(){qi=Math.floor(Math.random()*QUOTES.length);showQuote();var d=$('qd');if(d.showModal)d.showModal();else d.setAttribute('open','')}
$('goQuotes').onclick=openQuote;
$('qNew').onclick=function(){qi=(qi+1+Math.floor(Math.random()*(QUOTES.length-1)))%QUOTES.length;showQuote();haptic()};
$('qClose').onclick=function(){var d=$('qd');if(d.close)d.close();else d.removeAttribute('open')};
$('qShare').onclick=function(){var q=QUOTES[qi];var txt='«'+q[0]+'» — '+q[1];var url='https://t.me/anafra_bot/hubfinanciero?startapp=trivia';
  try{if(tg&&tg.openTelegramLink){tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(txt));return}}catch(e){}
  if(navigator.share)navigator.share({text:txt,url:url}).catch(function(){});else window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(txt+' '+url),'_blank')};

/* ---------- sonido ---------- */
function sndIc(){$('sndBtn').textContent=S.snd?'📳':'🔇'}
$('sndBtn').onclick=function(){S.snd=S.snd?0:1;sndIc();save();if(S.snd)haptic()};

sndIc();renderHome();
if(tg){try{tg.ready();tg.expand()}catch(e){}}
})();
</script>
<script src="telegram.js" defer></script>
</body>
</html>
