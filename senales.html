<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Señales de Mercado - Análisis Técnico</title>
<style>
:root{
  --bg:#0e1117;
  --panel:#131722;
  --panel-2:#1a1e29;
  --border:#2a2e39;
  --ink:#d1d4dc;
  --ink-strong:#f0f3fa;
  --dim:#787b86;
  --accent:#2962ff;
}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-strong);text-decoration:none;background:var(--panel-2);border:1px solid var(--border);padding:6px 12px;border-radius:6px}
.widget-container{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;padding:12px;margin-bottom:16px}
.title-section{font-size:14px;font-weight:600;color:var(--ink-strong);margin-bottom:12px;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">← Volver al Hub</a>
  <span style="font-size:12px; color:var(--dim);">SEÑALES Y RESUMEN TÉCNICO</span>
</header>

<div class="widget-container">
  <div class="title-section">📊 Resumen de Indicadores Técnicos (Compra / Venta)</div>

  <!-- Widget de Análisis Técnico en modo múltiple para ver muchos activos -->
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
    {
      "interval": "1h",
      "width": "100%",
      "isTransparent": true,
      "height": "550",
      "symbol": "FOREXCOM:SPXUSD",
      "showIntervalTabs": true,
      "displayMode": "multiple",
      "colorTheme": "dark",
      "locale": "es",
      "symbols": [
        { "description": "S&P 500", "proName": "FOREXCOM:SPXUSD" },
        { "description": "Nasdaq 100", "proName": "FOREXCOM:NSXUSD" },
        { "description": "Apple", "proName": "NASDAQ:AAPL" },
        { "description": "Microsoft", "proName": "NASDAQ:MSFT" },
        { "description": "NVIDIA", "proName": "NASDAQ:NVDA" },
        { "description": "Tesla", "proName": "NASDAQ:TSLA" },
        { "description": "Bitcoin", "proName": "BINANCE:BTCUSDT" },
        { "description": "Ethereum", "proName": "BINANCE:ETHUSDT" },
        { "description": "Solana", "proName": "BINANCE:SOLUSDT" },
        { "description": "EUR/USD", "proName": "FX:EURUSD" },
        { "description": "Oro", "proName": "OANDA:XAUUSD" }
      ]
    }
    </script>
  </div>
</div>

</body>
</html>
