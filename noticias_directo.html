<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>TV y radio en directo · Hub Financiero</title>
<style>
:root{--bg:#0b0e14;--pn:#141a24;--p2:#1c2431;--bd:#2a3342;--ink:#cfd5e1;--st:#f2f5fa;--dim:#8590a3;--ac:#2962ff;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f2f4f8;--pn:#fff;--p2:#eceff5;--bd:#dce1ea;--ink:#394150;--st:#0e1420;--dim:#6a7385;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--pn);border-bottom:1px solid var(--bd);padding:10px 14px;padding-top:calc(10px + max(env(safe-area-inset-top,0px),var(--tgtop,0px)))}
.r1{display:flex;align-items:center;justify-content:space-between}
.r1 a{color:var(--dim);text-decoration:none;font-size:13px}
h1{font-size:16px;margin:0;color:var(--st);display:flex;align-items:center;gap:7px}
.live{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.chip{flex:none;background:var(--p2);border:1px solid var(--bd);color:var(--ink);border-radius:14px;padding:6px 12px;font:inherit;font-size:13px}
.sep{flex:none;align-self:center;font-size:15px;margin:0 2px 0 6px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:760px;margin:0 auto;padding:12px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
