<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>Calendario Macroeconómico</title>
<style>
:root{
  --bg:#0e1117;
  --panel:#131722;
  --panel-2:#1a1e29;
  --border:#2a2e39;
  --ink:#d1d4dc;
  --ink-strong:#f0f3fa;
  --dim:#787b86;
  --up:#26a69a;
  --down:#ef5350;
  --amber:#f7a600;
}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-strong);text-decoration:none;background:var(--panel-2);border:1px solid var(--border);padding:6px 12px;border-radius:6px}
.status-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 6px var(--up)}

/* TARJETAS VISUALES */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.card-mini{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.card-mini .title{font-size:10px;color:var(--dim);text-transform:uppercase;font-weight:600;margin-bottom:6px}
.card-mini .val{font-size:18px;font-weight:700;color:var(--ink-strong)}
.card-mini .sub{font-size:10px;color:var(--amber);margin-top:4px}

.section-title{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* CONTENEDOR SEGURO */
.widget-box{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px;overflow:hidden}
.tradingview-widget-container{height:500px;width:100%}
.tradingview-widget-container__widget{height:100%;width:100%}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">← Volver al Hub</a>
  <div class="status-badge">
    <span class="dot-live"></span>
    <span>EVENTOS CLAVE EN DIRECTO</span>
  </div>
</header>

<!-- TARJETAS VISUALES CLAVE -->
<div class="grid-cards">
  <div class="card-mini">
    <div class="title">Fed Rate (EE. UU.)</div>
    <div class="val">Tipos Actuales</div>
    <div class="sub">Seguimiento Fed</div>
  </div>
  <div class="card-mini">
    <div class="title">Tipo BCE (Europa)</div>
    <div class="val">Zona Euro</div>
    <div class="sub">Política monetaria</div>
  </div>
  <div class="card-mini">
    <div class="title">Volatilidad</div>
    <div class="val">Alto Impacto</div>
    <div class="sub">USD / EUR</div>
  </div>
</div>

<!-- CALENDARIO DE EVENTOS BLINDADO -->
<div class="section-title">Calendario Macroeconómico</div>
<div class="widget-box">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
    {
      "colorTheme": "dark",
      "isTransparent": true,
      "width": "100%",
      "height": "500",
      "locale": "es",
      "importanceFilter": "0,1",
      "currencyFilter": "USD,EUR"
    }
    </script>
  </div>
</div>

</body>
</html>
