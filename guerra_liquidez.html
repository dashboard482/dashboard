<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d12">
<title>BTC WAR ZONE — Tactical Market Command</title>
<style>
:root{--bg:#06090e;--line:#22313c;--green:#54f2a1;--red:#ff536b;--amber:#ffc857;--text:#eaf2f7;--muted:#8497a4;--cyan:#65d9ef;--glass:rgba(16,26,36,.6)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse at 50% 40%,#142330 0%,#06090e 72%)}
#app{height:100dvh;min-height:420px;display:flex;flex-direction:column}
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;border-image:linear-gradient(90deg,#54f2a155,#ffc85755,#ff536b55) 1;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--amber);font-size:19px;background:linear-gradient(145deg,#22343f,#0a1117);box-shadow:0 0 0 1px #4a6575 inset,0 0 22px #ffc85733;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px #6b8696 inset,0 0 30px #ffc85766}}
.brand-title{font-weight:900;letter-spacing:2px;font-size:13px;white-space:nowrap;background:linear-gradient(90deg,#fff,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:1.4px;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:10px}
.connection{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;letter-spacing:.8px;white-space:nowrap}
