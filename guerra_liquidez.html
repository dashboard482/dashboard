<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guerra de Liquidez BTC — Order Book Live</title>
<style>
:root{--bg:#07090e;--panel:#10141d;--green:#00ffcc;--red:#ff3366;--amber:#ffcc00;--text:#f0f3fa}
*{box-sizing:border-box}
body,html{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Courier New', Courier, monospace;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.1);z-index:10;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.brand{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:1px}
.dot{width:8px;height:8px;border-radius:50%;background:#666}
.dot.live{background:var(--green);box-shadow:0 0 10px var(--green)}
.ctl{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:var(--text);font-family:inherit;font-size:12px;padding:6px 14px;border-radius:6px;text-decoration:none;cursor:pointer;transition:all .2s}
.ctl:hover{background:rgba(255,255,255,.15)}
#canvasContainer{flex:1;position:relative;width:100%;height:100%;background:radial-gradient(circle at center, #111827 0%, #07090e 100%)}
canvas{display:block;width:100%;height:100%}
.hud-overlay{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;font-size:11px;text-shadow:0 2px 6px rgba(0,0,0,0.9)}
.army-box{background:rgba(16,20,29,0.85);border:1px solid rgba(255,255,255,0.2);padding:10px 14px;border-radius:10px;backdrop-filter:blur(6px);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.army-box.green{border-color:var(--green);color:var(--green)}
.army-box.red{border-color:var(--red);color:var(--red)}
.center-price{text-align:center;background:rgba(16,20,29,0.85);padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.3);backdrop-filter:blur(6px);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
footer{padding:8px 16px;text-align:center;font-size:10px;color:rgba(255,255,255,.4);background:var(--panel);border-top:1px solid rgba(255,255,255,.1)}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><span id="dot" class="dot"></span><span>⚡ WARZONE: BTC ORDER BOOK</span></div>
    <a class="ctl" href="index.html">← Hub</a>
  </header>
  
  <div id="canvasContainer">
    <div class="hud-overlay">
      <div class="army-box green">🟢 TOROS (BIDS)<br><b id="bidVol" style="font-size:15px">0.0 BTC</b></div>
      <div class="center-price">
        PRECIO EN VIVO<br><b id="btcPrice" style="font-size:18px; color:var(--amber); text-shadow:0 0 10px rgba(255,204,0,0.5)">$—</b>
      </div>
      <div class="army-box red" style="text-align:right">🔴 OSOS (ASKS)<br><b id="askVol" style="font-size:15px">0.0 BTC</b></div>
    </div>
    <canvas id="battleCanvas"></canvas>
  </div>
  
  <footer>Visualizador de combate cibernético · Conexión WebSocket en directo con Binance</footer>
</div>

<script>
const canvas = document.getElementById('battleCanvas');
const ctx = canvas.getContext('2d');
const dot = document.getElementById('dot');
const btcPriceEl = document.getElementById('btcPrice');
const bidVolEl = document.getElementById('bidVol');
const askVolEl = document.getElementById('askVol');

let width, height;
function resize() {
  width = canvas.width = canvas.clientWidth * window.devicePixelRatio;
  height = canvas.height = canvas.clientHeight * window.devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();

let currentPrice = 0;
let bids = [];
let asks = [];
let projectiles = [];
let explosions = [];
let screenShake = 0;

// Clase para proyectiles de láser avanzados
class Laser {
  constructor(isBuy, amount) {
    this.x = isBuy ? width * 0.15 : width * 0.85;
    this.y = Math.random() * (height * 0.7) + (height * 0.15);
    this.targetX = isBuy ? width * 0.75 : width * 0.25;
    this.targetY = height / 2 + (Math.random() - 0.5) * (height * 0.5);
    this.speed = 35;
    const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    this.color = isBuy ? '#00ffcc' : '#ff3366';
    this.size = Math.min(Math.max(amount * 3, 3), 10);
    this.isBuy = isBuy;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    // Si llega al centro o destino, genera explosión y muere
    if (Math.abs(this.x - width/2) < 30) {
      explosions.push(new Explosion(this.x, this.y, this.color));
      return true;
    }
    return false;
  }
  draw() {
    ctx.save();
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.size;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.vx * 0.8, this.y - this.vy * 0.8);
    ctx.stroke();
    ctx.restore();
  }
}

// Clase para las explosiones al chocar los trades
class Explosion {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.radius = 5;
    this.maxRadius = Math.random() * 30 + 20;
    this.alpha = 1;
  }
  update() {
    this.radius += 3;
    this.alpha -= 0.05;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(this.alpha, 0);
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

let wsBook = null;
let wsTrade = null;

function connectStreams() {
  wsTrade = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
  wsTrade.onopen = () => { dot.className = 'dot live'; };
  wsTrade.onmessage = (event) => {
    const data = JSON.parse(event.data);
    currentPrice = parseFloat(data.p);
    btcPriceEl.textContent = '$' + currentPrice.toLocaleString('es-ES', {maximumFractionDigits:0});
    
    const isBuy = !data.m; 
    const qty = parseFloat(data.q);
    
    if (projectiles.length < 80) {
      projectiles.push(new Laser(isBuy, qty));
    }
    if (qty > 0.3) {
      screenShake = 12; // Temblor potente si hay orden grande
    }
  };

  wsBook = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@depth20@100ms');
  wsBook.onmessage = (event) => {
    const data = JSON.parse(event.data);
    bids = data.bids.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
    asks = data.asks.map(a => [parseFloat(a[0]), parseFloat(a[1])]);

    const totalBids = bids.reduce((acc, x) => acc + x[1], 0);
    const totalAsks = asks.reduce((acc, x) => acc + x[1], 0);

    bidVolEl.textContent = totalBids.toFixed(1) + ' BTC';
    askVolEl.textContent = totalAsks.toFixed(1) + ' BTC';
  };

  wsTrade.onclose = () => { dot.className = 'dot'; setTimeout(connectStreams, 3000); };
}
connectStreams();

// Bucle de animación principal a 60 FPS
function animate() {
  ctx.save();
  if (screenShake > 0) {
    const ox = (Math.random() - 0.5) * screenShake;
    const oy = (Math.random() - 0.5) * screenShake;
    ctx.translate(ox, oy);
    screenShake *= 0.85;
  }

  // Fondo dinámico con estela ligera
  ctx.fillStyle = 'rgba(7, 9, 14, 0.4)';
  ctx.fillRect(0, 0, width, height);

  // Línea central láser divisoria
  ctx.strokeStyle = 'rgba(255, 204, 0, 0.4)';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = 'var(--amber)';
  ctx.beginPath();
  ctx.moveTo(width / 2, 0);
  ctx.lineTo(width / 2, height);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Renderizar Muros de Compras (Torres Verdes - Izquierda)
  let bMax = Math.max(...bids.map(x => x[1]), 1);
  bids.slice(0, 10).forEach((b, i) => {
    const barH = height / 12;
    const y = i * barH + 40;
    const maxW = width * 0.32;
    const w = (b[1] / bMax) * maxW;

    ctx.fillStyle = 'rgba(0, 255, 204, 0.15)';
    ctx.fillRect(width / 2 - 20 - w, y, w, barH - 6);
    
    // Núcleo de energía de la muralla
    ctx.fillStyle = '#00ffcc';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00ffcc';
    ctx.fillRect(width / 2 - 24, y, 4, barH - 6);
    ctx.shadowBlur = 0;
  });

  // Renderizar Muros de Ventas (Torres Rojas - Derecha)
  let aMax = Math.max(...asks.map(x => x[1]), 1);
  asks.slice(0, 10).forEach((a, i) => {
    const barH = height / 12;
    const y = i * barH + 40;
    const maxW = width * 0.32;
    const w = (a[1] / aMax) * maxW;

    ctx.fillStyle = 'rgba(255, 51, 102, 0.15)';
    ctx.fillRect(width / 2 + 20, y, w, barH - 6);

    // Núcleo de energía de la muralla
    ctx.fillStyle = '#ff3366';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#ff3366';
    ctx.fillRect(width / 2 + 20, y, 4, barH - 6);
    ctx.shadowBlur = 0;
  });

  // Actualizar y dibujar láseres / proyectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    let p = projectiles[i];
    if (p.update()) {
      projectiles.splice(i, 1);
    } else {
      p.draw();
    }
  }

  // Actualizar y dibujar explosiones
  for (let i = explosions.length - 1; i >= 0; i--) {
    let ex = explosions[i];
    ex.update();
    ex.draw();
    if (ex.alpha <= 0) {
      explosions.splice(i, 1);
    }
  }

  ctx.restore();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
