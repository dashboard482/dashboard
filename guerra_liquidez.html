<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BTC Space Wars — Guerra de Liquidez</title>
<style>
:root{--bg:#030508;--panel:#0d111a;--green:#00ffcc;--red:#ff2a5f;--amber:#ffcc00;--text:#f0f3fa}
*{box-sizing:border-box}
body,html{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.1);z-index:10}
.brand{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;letter-spacing:0.5px}
.dot{width:7px;height:7px;border-radius:50%;background:#666}
.dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
.ctl{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,0.2);color:var(--text);font-size:11px;padding:5px 10px;border-radius:6px;text-decoration:none}
#canvasContainer{flex:1;position:relative;width:100%;height:100%;background:radial-gradient(circle at center, #111b33 0%, #030508 100%)}
canvas{display:block;width:100%;height:100%}
.hud-overlay{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-size:10px}
.army-box{background:rgba(13,17,26,0.9);border:1px solid rgba(255,255,255,0.2);padding:6px 10px;border-radius:8px;backdrop-filter:blur(4px)}
.army-box.green{border-color:var(--green);color:var(--green)}
.army-box.red{border-color:var(--red);color:var(--red)}
.center-price{text-align:center;background:rgba(13,17,26,0.9);padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.3);backdrop-filter:blur(4px)}
footer{padding:6px;text-align:center;font-size:9px;color:rgba(255,255,255,.4);background:var(--panel);border-top:1px solid rgba(255,255,255,.1)}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><span id="dot" class="dot"></span><span>🚀 BTC SPACE WARS: ORDER BOOK</span></div>
    <a class="ctl" href="index.html">← Hub</a>
  </header>
  
  <div id="canvasContainer">
    <div class="hud-overlay">
      <div class="army-box green">🟢 FLOTA COMPRAS<br><b id="bidVol" style="font-size:13px">0 BTC</b></div>
      <div class="center-price">
        PRECIO BTC<br><b id="btcPrice" style="font-size:14px; color:var(--amber)">$—</b>
      </div>
      <div class="army-box red" style="text-align:right">🔴 FLOTA VENTAS<br><b id="askVol" style="font-size:13px">0 BTC</b></div>
    </div>
    <canvas id="battleCanvas"></canvas>
  </div>
  
  <footer>Batalla espacial en tiempo real · Conexión WebSocket Binance</footer>
</div>

<script>
const canvas = document.getElementById('battleCanvas');
const ctx = canvas.getContext('2d');
const dot = document.getElementById('dot');
const btcPriceEl = document.getElementById('btcPrice');
const bidVolEl = document.getElementById('bidVol');
const askVolEl = document.getElementById('askVol');

let width, height;
function resize() {
  width = canvas.width = canvas.clientWidth * window.devicePixelRatio;
  height = canvas.height = canvas.clientHeight * window.devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();

let currentPrice = 0;
let bids = [];
let asks = [];
let ships = [];
let lasers = [];
let explosions = [];

// Clase para las Naves espaciales de cada bando
class Ship {
  constructor(isBuy) {
    this.isBuy = isBuy;
    this.x = isBuy ? 40 : width - 40;
    this.y = Math.random() * (height - 120) + 60;
    this.targetY = this.y + (Math.random() - 0.5) * 100;
    this.speed = 1.5 + Math.random() * 2;
    this.color = isBuy ? '#00ffcc' : '#ff2a5f';
    this.size = 14 + Math.random() * 6;
  }
  update() {
    // Movimiento flotante arriba y abajo
    if (this.y < this.targetY) this.y += 0.5;
    else this.y -= 0.5;
    if (Math.random() < 0.02) this.targetY = Math.random() * (height - 120) + 60;
  }
  draw() {
    ctx.save();
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    // Dibujar forma de nave espacial poligonal
    if (this.isBuy) {
      ctx.moveTo(this.x + this.size, this.y);
      ctx.lineTo(this.x - this.size, this.y - this.size * 0.7);
      ctx.lineTo(this.x - this.size * 0.5, this.y);
      ctx.lineTo(this.x - this.size, this.y + this.size * 0.7);
    } else {
      ctx.moveTo(this.x - this.size, this.y);
      ctx.lineTo(this.x + this.size, this.y - this.size * 0.7);
      ctx.lineTo(this.x + this.size * 0.5, this.y);
      ctx.lineTo(this.x + this.size, this.y + this.size * 0.7);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// Clase para disparos láser animados
class LaserShot {
  constructor(isBuy, startY) {
    this.x = isBuy ? 60 : width - 60;
    this.y = startY;
    this.vx = isBuy ? 22 : -22;
    this.color = isBuy ? '#00ffcc' : '#ff2a5f';
  }
  update() {
    this.x += this.vx;
  }
  draw() {
    ctx.save();
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 4;
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.vx * 0.6, this.y);
    ctx.stroke();
    ctx.restore();
  }
}

// Clase para explosiones de impacto
class ParticleExplosion {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.particles = [];
    for (let i = 0; i < 12; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1
      });
    }
  }
  update() {
    this.particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.04;
    });
  }
  draw() {
    ctx.save();
    this.particles.forEach(p => {
      if (p.alpha <= 0) return;
      ctx.fillStyle = this.color;
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }
}

// Crear flota inicial de naves espaciales
for (let i = 0; i < 6; i++) {
  ships.push(new Ship(true));  // Naves de compra
  ships.push(new Ship(false)); // Naves de venta
}

let wsBook = null;
let wsTrade = null;

function connectStreams() {
  wsTrade = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
  wsTrade.onopen = () => { dot.className = 'dot live'; };
  wsTrade.onmessage = (event) => {
    const data = JSON.parse(event.data);
    currentPrice = parseFloat(data.p);
    btcPriceEl.textContent = '$' + currentPrice.toLocaleString('es-ES', {maximumFractionDigits:0});
    
    const isBuy = !data.m;
    // Disparar láser desde una nave aleatoria del bando correspondiente
    const bandoNaves = ships.filter(s => s.isBuy === isBuy);
    if (bandoNaves.length > 0) {
      const shooter = bandoNaves[Math.floor(Math.random() * bandoNaves.length)];
      if (lasers.length < 30) {
        lasers.push(new LaserShot(isBuy, shooter.y));
      }
    }
  };

  wsBook = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@depth20@100ms');
  wsBook.onmessage = (event) => {
    const data = JSON.parse(event.data);
    bids = data.bids.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
    asks = data.asks.map(a => [parseFloat(a[0]), parseFloat(a[1])]);

    const totalBids = bids.reduce((acc, x) => acc + x[1], 0);
    const totalAsks = asks.reduce((acc, x) => acc + x[1], 0);

    bidVolEl.textContent = totalBids.toFixed(1) + ' BTC';
    askVolEl.textContent = totalAsks.toFixed(1) + ' BTC';
  };

  wsTrade.onclose = () => { dot.className = 'dot'; setTimeout(connectStreams, 3000); };
}
connectStreams();

function animate() {
  // Fondo de espacio con estela estelar
  ctx.fillStyle = 'rgba(3, 5, 8, 0.4)';
  ctx.fillRect(0, 0, width, height);

  // Línea de frente en el centro de la batalla
  ctx.strokeStyle = 'rgba(255, 204, 0, 0.35)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(width / 2, 70);
  ctx.lineTo(width / 2, height - 20);
  ctx.stroke();
  ctx.setLineDash([]);

  // Renderizar Muros de Compras (Escudos de energía verdes - Izquierda)
  let maxBidVal = Math.max(...bids.map(x => x[1]), 1);
  bids.slice(0, 8).forEach((b, i) => {
    const rowH = (height - 100) / 8;
    const y = i * rowH + 80;
    const maxBarW = (width / 2) - 70;
    const barW = Math.min((b[1] / maxBidVal) * maxBarW, maxBarW);

    ctx.fillStyle = 'rgba(0, 255, 204, 0.15)';
    ctx.fillRect(width / 2 - 30 - barW, y, barW, rowH - 8);
    
    ctx.fillStyle = '#00ffcc';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00ffcc';
    ctx.fillRect(width / 2 - 32, y, 3, rowH - 8);
    ctx.shadowBlur = 0;
  });

  // Renderizar Muros de Ventas (Escudos de energía rojos - Derecha)
  let maxAskVal = Math.max(...asks.map(x => x[1]), 1);
  asks.slice(0, 8).forEach((a, i) => {
    const rowH = (height - 100) / 8;
    const y = i * rowH + 80;
    const maxBarW = (width / 2) - 70;
    const barW = Math.min((a[1] / maxAskVal) * maxBarW, maxBarW);

    ctx.fillStyle = 'rgba(255, 42, 95, 0.15)';
    ctx.fillRect(width / 2 + 30, y, barW, rowH - 8);
    
    ctx.fillStyle = '#ff2a5f';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#ff2a5f';
    ctx.fillRect(width / 2 + 30, y, 3, rowH - 8);
    ctx.shadowBlur = 0;
  });

  // Actualizar y pintar naves
  ships.forEach(s => {
    s.update();
    s.draw();
  });

  // Actualizar y pintar láseres
  for (let i = lasers.length - 1; i >= 0; i--) {
    let l = lasers[i];
    l.update();
    l.draw();

    // Si cruza el centro, genera explosión
    if (Math.abs(l.x - width / 2) < 20) {
      explosions.push(new ParticleExplosion(l.x, l.y, l.color));
      lasers.splice(i, 1);
    } else if (l.x < 0 || l.x > width) {
      lasers.splice(i, 1);
    }
  }

  // Actualizar y pintar explosiones de partículas
  for (let i = explosions.length - 1; i >= 0; i--) {
    let ex = explosions[i];
    ex.update();
    ex.draw();
    if (ex.particles[0].alpha <= 0) {
      explosions.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
