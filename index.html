<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<title>Hub Financiero · Enlaces</title>
<style>
:root{--bg:#0e1117;--panel:#131722;--panel-2:#1a1e29;--hover:#1f2430;--border:#2a2e39;--border-hover:#363a45;--ink:#d1d4dc;--ink-strong:#f0f3fa;--dim:#787b86;--dim2:#5d606b;--accent:#2962ff;--up:#26a69a;--down:#ef5350;--amber:#f7a600;--hh:57px}
:root[data-theme=light]{--bg:#f3f5f9;--panel:#fff;--panel-2:#fff;--hover:#eef1f7;--border:#dde1ea;--border-hover:#c3c9d6;--ink:#363a45;--ink-strong:#0e1117;--dim:#6b6f7c;--dim2:#8b8f9b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
html{scroll-padding-top:calc(var(--hh) + 60px)}
#stage{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:16px;font-weight:600;margin:0;color:var(--ink-strong)}
.tag{font-size:10px;font-weight:600;color:var(--amber);background:rgba(247,166,0,.12);padding:3px 6px;border-radius:4px}
a.idx{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;border:1px solid var(--border);background:var(--panel-2);color:var(--ink-strong);text-decoration:none;white-space:nowrap}
a.idx[hidden]{display:none}
#ticker{display:flex;align-items:center;gap:12px;font-size:12px;font-variant-numeric:tabular-nums}
.tk{display:flex;gap:4px;align-items:baseline}
.tk .s{color:var(--dim);font-weight:600;font-size:10px}.tk .p{color:var(--ink-strong);font-weight:600}.tk .c{font-size:10px;color:var(--dim)}
.tk .c.up{color:var(--up)}.tk .c.down{color:var(--down)}
#tkdot{width:6px;height:6px;border-radius:50%;background:var(--dim2)}#tkdot.live{background:var(--up)}#tkdot.poll{background:var(--amber)}
.bar{position:sticky;top:var(--hh);z-index:9;display:flex;gap:8px;padding:10px 16px;background:var(--bg)}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);padding:8px 12px;border-radius:6px;transition:border-color .2s}
.search-box:focus-within{border-color:var(--accent)}
.search-box svg{width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:2;flex:none}
.search-box input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink-strong);font:inherit;font-size:16px;outline:0}
.search-box kbd{font-size:10px;color:var(--dim2);border:1px solid var(--border);border-radius:3px;padding:1px 5px}
.ib{background:var(--panel-2);border:1px solid var(--border);color:var(--ink);border-radius:6px;padding:0 12px;font-size:15px;cursor:pointer}
.ib.on{border-color:var(--accent);color:var(--accent)}
main{flex:1;padding:4px 16px 40px;max-width:1200px;margin:0 auto;width:100%}
#tools{display:none;gap:8px;flex-wrap:wrap;margin:4px 0 14px}#tools.on{display:flex}
.btn{background:var(--panel-2);border:1px solid var(--border);color:var(--ink);border-radius:6px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.category{margin-bottom:24px}
.cat-title{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cat-title::after{content:'';flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;gap:4px;background:var(--panel-2);border:1px solid var(--border);padding:12px 14px;border-radius:6px;text-decoration:none;overflow:hidden;transition:transform .15s,border-color .15s,background .15s}
.card:hover{border-color:var(--border-hover);background:var(--hover);transform:translateY(-1px)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc,var(--accent));opacity:.8}
.ch{display:flex;justify-content:space-between;gap:8px}
.ct{font-size:13px;font-weight:600;color:var(--ink-strong);line-height:1.3}
.ci{font-size:16px;opacity:.85}
.cd{font-size:11px;color:var(--dim);line-height:1.35}
.cu{font-size:9px;color:var(--dim2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:rgba(247,166,0,.3);color:inherit;border-radius:2px}
.act{position:absolute;right:6px;bottom:4px;display:flex;gap:2px}
.act button{background:none;border:0;color:var(--dim2);font-size:16px;padding:4px 6px;cursor:pointer;line-height:1}
.act .star.on{color:var(--amber)}.act .del{color:var(--down)}
#noResults{display:none;text-align:center;padding:40px;color:var(--dim);font-size:14px}
footer{text-align:center;padding:20px;font-size:10px;color:var(--dim2);border-top:1px solid var(--border)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:16px;width:min(92vw,400px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 10px;font-size:15px;color:var(--ink-strong)}
dialog label{display:block;font-size:11px;color:var(--dim);margin:8px 0 3px}
dialog input,dialog select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--ink-strong);border-radius:6px;padding:8px;font:inherit;font-size:16px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}header{padding-left:12px;padding-right:12px}.bar{padding:8px 12px}main{padding:4px 12px 30px}.search-box kbd{display:none}#ticker{gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
</style>
</head>
<body>
<div id="stage">
<header id="hdr">
  <div class="brand"><h1>Hub Financiero</h1><span class="tag">LINKS</span><a id="idx" class="idx" href="caro_barato_btc.html" title="BTC: caro o barato" hidden></a></div>
  <div id="ticker"><span id="tkdot" title="Estado del ticker"></span></div>
</header>
<div class="bar">
  <label class="search-box">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="q" placeholder="Buscar herramienta, exchange, noticia..." autocomplete="off" enterkeyhint="search">
    <kbd>/</kbd>
  </label>
  <button class="ib" id="themeBtn" title="Tema" aria-label="Cambiar tema">◐</button>
  <button class="ib" id="editBtn" title="Editar enlaces" aria-label="Editar enlaces">✎</button>
</div>
<main>
  <div id="tools">
    <button class="btn pri" id="addBtn">+ Añadir enlace</button>
    <button class="btn" id="expBtn">Exportar</button>
    <button class="btn" id="impBtn">Importar</button>
    <button class="btn" id="rstBtn">Restaurar</button>
  </div>
  <div id="links"></div>
  <div id="noResults">No se encontraron enlaces que coincidan con tu búsqueda.</div>
</main>
<footer>Recopilación de enlaces de interés · DYOR</footer>
</div>

<dialog id="dlg">
  <form id="frm" method="dialog">
    <h2>Añadir enlace</h2>
    <label>Título</label><input id="fT" required maxlength="40">
    <label>URL</label><input id="fU" type="url" required placeholder="https://">
    <label>Descripción</label><input id="fD" maxlength="80">
    <label>Categoría</label><select id="fC"></select>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn pri" id="fOk" value="ok">Guardar</button></div>
  </form>
