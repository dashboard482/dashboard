  const cat=catOf(l.c);
  const a=el('a','card');a.href=l.u;a.target='_blank';a.rel='noopener noreferrer';
  a.style.setProperty('--cc',cat.color);
  const h=el('div','ch'),t=el('div','ct');hl(t,l.t,term);h.append(t,el('div','ci',l.i));
  const d=el('div','cd');hl(d,l.d,term);
  let dom;try{dom=new URL(l.u).hostname.replace(/^www\./,'')}catch(e){dom=l.u}
  a.append(h,d,el('div','cu',dom));
  const act=el('div','act');
  const star=el('button','star'+(S.fav.includes(l.u)?' on':''),S.fav.includes(l.u)?'★':'☆');
  star.type='button';star.title='Favorito';
  star.onclick=e=>{e.preventDefault();e.stopPropagation();
    S.fav=S.fav.includes(l.u)?S.fav.filter(x=>x!==l.u):[...S.fav,l.u];save();render()};
  act.append(star);
  if(editing){
    const del=el('button','del','✕');del.type='button';del.title='Quitar';
    del.onclick=e=>{e.preventDefault();e.stopPropagation();
      if(!confirm('¿Quitar "'+l.t+'"?'))return;
      if(l.custom)S.custom=S.custom.filter(x=>x.u!==l.u);else S.removed.push(l.u);
      S.fav=S.fav.filter(x=>x!==l.u);save();render()};
    act.append(del);
  }
  a.append(act);
  a.addEventListener('click',e=>{
    if(e.target.closest('.act'))return;
    S.clicks[l.u]=(S.clicks[l.u]||0)+1;save();
  });
  return a;
}

function section(cat,links,term){
  const s=el('div','category');
  s.append(el('div','cat-title',cat.name));
  const g=el('grid','grid');links.forEach(l=>g.append(card(l,term)));
  s.append(g);return s;
}

function render(){
  const term=fold($('q').value.trim());
  const box=$('links');box.textContent='';
  const all=allLinks();let n=0;
  if(!term){
    const fav=S.fav.map(u=>all.find(l=>l.u===u)).filter(Boolean);
    if(fav.length)box.append(section(CATS[0],fav.map(l=>({...l,c:'fav'})),''));
    const top=all.filter(l=>S.clicks[l.u]>0).sort((a,b)=>S.clicks[b.u]-S.clicks[a.u]).slice(0,4);
    if(top.length)box.append(section(CATS[1],top.map(l=>({...l,c:'top'})),''));
  }
  REAL.forEach(cat=>{
    const ls=all.filter(l=>l.c===cat.id&&(!term||fold(l.t+' '+l.d+' '+l.u).includes(term)));
    if(!ls.length)return;n+=ls.length;box.append(section(cat,ls,term));
  });
  $('noResults').style.display=n===0?'block':'none';
}

/* ---------- INTEGRACIÓN TELEGRAM STARS ---------- */

/* ---------- búsqueda ---------- */
$('q').addEventListener('input',render);
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus();$('q').select()}
  if(e.key==='Escape'&&document.activeElement===$('q')){$('q').value='';render();$('q').blur()}
});

/* ---------- tema ---------- */
function applyTheme(){
  const t=S.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name=theme-color]').content=t==='light'?'#ffffff':'#0e1117';
}
$('themeBtn').onclick=()=>{S.theme=document.documentElement.dataset.theme==='light'?'dark':'light';save();applyTheme()};
applyTheme();

/* ---------- altura real del header ---------- */
const hdr=$('hdr');
const setHH=()=>document.documentElement.style.setProperty('--hh',hdr.offsetHeight+'px');
setHH();
if('ResizeObserver' in window)new ResizeObserver(setHH).observe(hdr);else addEventListener('resize',setHH);

/* ---------- edición ---------- */
$('editBtn').onclick=()=>{editing=!editing;$('editBtn').classList.toggle('on',editing);$('tools').classList.toggle('on',editing);render()};
const fC=$('fC');
REAL.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;fC.append(o)});
$('addBtn').onclick=()=>{$('frm').reset();$('dlg').showModal()};
$('frm').addEventListener('submit',e=>{
  if(e.submitter&&e.submitter.value!=='ok')return;
  let u=$('fU').value.trim();
  try{u=new URL(u).href}catch(x){return}
  if(!/^https?:/.test(u))return;
  S.custom.push({t:$('fT').value.trim(),u,d:$('fD').value.trim(),c:fC.value,i:'🔗'});
  S.removed=S.removed.filter(x=>x!==u);save();render();
});
$('expBtn').onclick=async()=>{
  const j=JSON.stringify(S);
  try{await navigator.clipboard.writeText(j);alert('Copiado al portapapeles. Pégalo donde quieras como copia de seguridad.')}
  catch(e){prompt('Copia tus datos:',j)}
};
$('impBtn').onclick=()=>{
  const j=prompt('Pega aquí los datos exportados:');if(!j)return;
  try{const r=JSON.parse(j);S=Object.assign({fav:[],clicks:{},custom:[],removed:[],theme:null},r);save();applyTheme();render()}
  catch(e){alert('Datos no válidos.')}
};
$('rstBtn').onclick=()=>{
  if(!confirm('¿Restaurar todo? Se borran favoritos, usos y cambios.'))return;
  S={fav:[],clicks:{},custom:[],removed:[],theme:null};save();applyTheme();render();
};

/* ---------- ticker: BTC, ETH, SOL con reconexión, respaldo y pausa ---------- */
const COINS=[['btcusdt','BTC','bitcoin'],['ethusdt','ETH','ethereum'],['solusdt','SOL','solana']];
const tk={},tkEl=$('ticker'),dot=$('tkdot');
COINS.forEach(c=>{
  const w=el('span','tk');const s=el('span','s',c[1]),p=el('span','p','—'),ch=el('span','c','');
  w.append(s,p,ch);tkEl.insertBefore(w,dot);tk[c[0]]={p,ch,id:c[2]};
});
function setPrice(key,price,pct){
  const t=tk[key];if(!t||!isFinite(price))return;
  t.p.textContent='$'+price.toLocaleString('es-ES',{maximumFractionDigits:price<10?3:0});
  if(isFinite(pct)){t.ch.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';t.ch.className='c '+(pct>=0?'up':'down')}
}
let ws=null,retry=0,timer=null,poll=null;
function stopAll(){clearTimeout(timer);clearInterval(poll);poll=null;if(ws){ws.onclose=null;ws.close();ws=null}}
async function fetchBackup(){
  try{
    const ids=COINS.map(c=>c[2]).join(',');
    const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+ids+'&vs_currencies=usd&include_24hr_change=true');
    const j=await r.json();
    COINS.forEach(c=>{const d=j[c[2]];if(d)setPrice(c[0],d.usd,d.usd_24h_change)});
    dot.className='poll';
  }catch(e){}
}
function startPoll(){if(poll)return;fetchBackup();poll=setInterval(fetchBackup,60000)}
function connect(){
  if(document.hidden)return;
  try{
    ws=new WebSocket('wss://stream.binance.com:9443/stream?streams='+COINS.map(c=>c[0]+'@ticker').join('/'));
    ws.onopen=()=>{retry=0;clearInterval(poll);poll=null;dot.className='live'};
    ws.onmessage=ev=>{try{const d=JSON.parse(ev.data).data;if(d&&d.s)setPrice(d.s.toLowerCase(),parseFloat(d.c),parseFloat(d.P))}catch(e){}};
    ws.onclose=()=>{ws=null;dot.className='';startPoll();
      timer=setTimeout(connect,Math.min(30000,2000*Math.pow(2,retry++)))};
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }catch(e){startPoll();timer=setTimeout(connect,Math.min(30000,2000*Math.pow(2,retry++)))}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopAll();dot.className=''}else{retry=0;connect()}
});
connect();

/* ---------- PWA: manifest e icono generados al vuelo ---------- */
try{
  const cv=document.createElement('canvas');cv.width=cv.height=180;
  const x=cv.getContext('2d');x.fillStyle='#0e1117';x.fillRect(0,0,180,180);
  x.fillStyle='#f7a600';x.font='bold 84px -apple-system,Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('HF',90,95);
  const png=cv.toDataURL('image/png');
  const ic=document.createElement('link');ic.rel='apple-touch-icon';ic.href=png;document.head.append(ic);
  const man={name:'Hub Financiero',short_name:'Hub',display:'standalone',background_color:'#0e1117',theme_color:'#0e1117',
    start_url:location.href.split('#')[0],icons:[{src:png,sizes:'180x180',type:'image/png'}]};
  const ml=document.createElement('link');ml.rel='manifest';
  ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
  document.head.append(ml);
}catch(e){}

/* ---------- índice BTC caro/barato ---------- */
const idx=$('idx');
function showIdx(d){
  if(!d||typeof d.v!=='number'||typeof d.lab!=='string'||!/^#[0-9a-f]{3,6}$/i.test(d.col))return;
  idx.hidden=false;idx.textContent='';
  const dt=el('span');dt.style.cssText='width:7px;height:7px;border-radius:50%;margin-right:5px;background:'+d.col;
  idx.append(dt,d.v+' · '+d.lab);
}
try{showIdx(JSON.parse(localStorage.getItem('hub.idx')||'null'))}catch(e){}
const bf=document.createElement('iframe');bf.src='caro_barato_btc.html';bf.hidden=true;bf.tabIndex=-1;bf.title='';
addEventListener('message',e=>{
  const d=e.data;
  if(!d||d.type!=='btc-index'||e.source!==bf.contentWindow)return;
  showIdx(d);
  try{localStorage.setItem('hub.idx',JSON.stringify({v:d.v,lab:d.lab,col:d.col}))}catch(x){}
});
document.body.append(bf);

render();
})();
</script>
