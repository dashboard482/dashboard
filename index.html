<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>Hub de Bolsa & Mercados</title>
<style>
:root{
  --bg:#0e1117;
  --panel:#131722;
  --panel-2:#1a1e29;
  --border:#2a2e39;
  --ink:#d1d4dc;
  --ink-strong:#f0f3fa;
  --dim:#787b86;
  --up:#26a69a;
  --down:#ef5350;
}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-strong);text-decoration:none;background:var(--panel-2);border:1px solid var(--border);padding:6px 12px;border-radius:6px}
.status-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 6px var(--up)}
.cat-title{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.cat-title::after{content:'';flex:1;height:1px;background:var(--border)}
.widget-box{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:15px;margin-bottom:20px}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">← Volver al Hub</a>
  <div class="status-badge">
    <span class="dot-live"></span>
    <span>MI CARTERA & MERCADOS GLOBALES (EN VIVO)</span>
  </div>
</header>

<div class="cat-title">ETFs Globales (Vanguard / FTSE)</div>
<div class="widget-box">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
    {
      "width": "100%",
      "height": "220",
      "symbolsGroups": [
        {
          "name": "ETFs FTSE",
          "symbols": [
            { "name": "XETRA:VGWL", "displayName": "Vanguard FTSE All-World UCITS ETF" },
            { "name": "LSE:VWRL", "displayName": "Vanguard FTSE All-World (USD)" }
          ]
        }
      ],
      "showSymbolLogo": true,
      "colorTheme": "dark",
      "isTransparent": true,
      "locale": "es"
    }
    </script>
  </div>
</div>

<div class="cat-title">Innovación, Espacio (SpaceX), Cuántica y Materiales</div>
<div class="widget-box">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
    {
      "width": "100%",
      "height": "360",
      "symbolsGroups": [
        {
          "name": "Temáticos & Innovación",
          "symbols": [
            { "name": "NASDAQ:SPCX", "displayName": "SpaceX (Class A)" },
            { "name": "XETRA:J20A", "displayName": "VanEck Space Innovators UCITS ETF" },
            { "name": "NYSE:MP", "displayName": "MP Materials Corp." },
            { "name": "NYSE:IONQ", "displayName": "IonQ, Inc." }
          ]
        }
      ],
      "showSymbolLogo": true,
      "colorTheme": "dark",
      "isTransparent": true,
      "locale": "es"
    }
    </script>
  </div>
</div>

<div class="cat-title">Materias Primas & Metales (En Directo)</div>
<div class="widget-box">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
    {
      "width": "100%",
      "height": "220",
      "symbolsGroups": [
        {
          "name": "Metales",
          "symbols": [
            { "name": "COMEX:GC1!", "displayName": "Oro (Gold)" },
            { "name": "COMEX:SI1!", "displayName": "Plata (Silver)" }
          ]
        }
      ],
      "showSymbolLogo": true,
      "colorTheme": "dark",
      "isTransparent": true,
      "locale": "es"
    }
    </script>
  </div>
</div>

<div class="cat-title">Mapa de Calor Sectorial (S&P 500)</div>
<div class="widget-box">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
    {
      "exchanges": [],
      "dataSource": "SPX500",
      "grouping": "sector",
      "width": "100%",
      "height": "450",
      "colorTheme": "dark",
      "locale": "es",
      "symbolUrl": "",
      "isTransparent": true
    }
    </script>
  </div>
</div>

</body>
</html>
